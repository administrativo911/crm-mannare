:root{
  --azul:#0000FF;--azul-80:#3333FF;--azul-60:#6666FF;--azul-40:#9999FF;--azul-20:#CCCCFF;--azul-10:#EBEBFF;
  --ciano:#00D2FF;--ciano-20:#CCF6FF;--amarelo:#FDCA40;--amarelo-20:#FFF4D9;--preto:#0B0B1A;
  --navy:#0000FF;--indigo:#0000FF;--indigo-soft:#EBEBFF;
  --bg:#EEF0FA;--panel:#fff;--ink:#14152B;--muted:#6B6E85;--line:#E8E9F2;--soft:#F5F6FB;
  --danger:#D92D20;--warn:#9A6700;--ok:#067647;
  --r-lg:22px;--r:14px;--r-sm:10px;
  --shadow:0 1px 2px rgba(20,21,60,.04),0 8px 28px rgba(20,21,60,.06);
  --kanit:Kanit,Urbanist,system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;overflow-x:clip}
body{font:15px/1.45 Urbanist,"Forma DJR Display",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.spacer{flex:1}
.ic{width:18px;height:18px;flex:none;fill:currentColor;vertical-align:-3px}
.ic.sm{width:14px;height:14px;vertical-align:-2px}
/* botões */
.btn{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:600;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--azul-40)}
.btn.primary{background:var(--azul);color:#fff;border-color:var(--azul)}
.btn.primary:hover{background:var(--azul-80)}
.btn.black{background:var(--preto);color:#fff;border-color:var(--preto)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--danger)}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:#fff}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
/* app */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;overflow:auto;border-right:1px solid var(--line)}
.side .logo{width:calc(100% - 16px);max-width:190px;height:auto;margin:4px 8px 30px}
.side .leg{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 12px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;cursor:pointer;color:#4B4E66;font-weight:600;font-size:15px;text-align:left;width:100%;border-radius:12px;transition:background .15s}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav.on{color:#fff;background:var(--azul)}
.nav .n{margin-left:auto;background:var(--azul-10);color:var(--azul);font-size:11.5px;padding:1px 8px;font-weight:700;border-radius:999px}
.nav.on .n{background:rgba(255,255,255,.22);color:#fff}
.nav.off{opacity:.4;cursor:default}
.nav.off:hover{background:none}
.sidebox{margin-top:auto;background:var(--azul-10);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.sidebox::after{content:"";position:absolute;right:-26px;top:-26px;width:80px;height:80px;background:var(--azul-20);border-radius:50%}
.sidebox b{font-family:var(--kanit);font-size:17px;font-weight:600;display:block;position:relative;color:var(--azul);line-height:1.15}
.sidebox p{font-size:12.5px;margin:6px 0 14px;color:#4B4E66;position:relative}
.sidebox .btn{width:100%;justify-content:center;position:relative}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:18px 32px 0}
.gsearch{flex:1;max-width:440px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:10px 16px;background:#fff;color:var(--muted);border-radius:999px}
.gsearch input{border:0;background:none;outline:none;flex:1;color:var(--ink)}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--ink);border-radius:50%}
.iconbtn:hover{border-color:var(--azul-40)}
.iconbtn .badge{position:absolute;top:-4px;right:-4px}
.chip-me{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:4px 14px 4px 4px;background:#fff;cursor:pointer;position:relative;border-radius:999px}
.chip-me .nm{font-weight:700;font-size:14px;line-height:1.1}
.chip-me .em{font-size:12px;color:var(--muted)}
.chip-me select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.content{padding:22px 32px 48px}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.pagehead .hi{color:var(--muted);font-size:15px;margin-bottom:4px}
.pagehead h1{font-family:var(--kanit);font-weight:600;font-size:34px;line-height:1.05;margin:0;letter-spacing:-.01em}
.pagehead h1.big{font-size:46px}
.pagehead p{margin:6px 0 0;color:var(--muted);font-size:16px}
.banner{background:var(--amarelo-20);border:0;color:#5c4300;padding:10px 16px;border-radius:var(--r);margin-bottom:16px;font-size:13px}
/* cartões base */
.blk,.card,.sect{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);border:0}
.blk{padding:20px 22px;min-width:0;position:relative}
.blk h3{font-family:var(--kanit);font-weight:500;font-size:18px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.blk h3 .cnt{background:var(--soft);color:var(--muted);font-size:12.5px;font-family:Urbanist,sans-serif;font-weight:700;padding:1px 9px;border-radius:999px}
.sect{padding:18px 20px;margin-bottom:14px}
.sect h4{margin:0 0 12px;font-family:var(--kanit);font-weight:500;font-size:16px;display:flex;align-items:center;gap:8px}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.sub{color:var(--muted);font-size:12.5px}
.late{color:var(--danger);font-weight:700}
.soon{color:var(--warn);font-weight:700}
.empty{padding:36px;text-align:center;color:var(--muted)}
.link{color:var(--azul);font-weight:600;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
/* etiquetas */
.pill,.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.4}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;background:currentColor}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;background:var(--soft);border-radius:999px}
.stchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.st-online{background:#12B76A}.st-ausente{background:var(--amarelo)}.st-offline{background:#B0B3C3}.st-folga{background:var(--ciano)}
/* avatares */
.av{width:28px;height:28px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;flex:none;overflow:hidden;position:relative;font-family:var(--kanit)}
.av.sm{width:26px;height:26px;font-size:9.5px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.none{background:#fff;border:1.5px dashed #B4B7C9;color:#98A2B3}
.avw{position:relative;display:inline-flex;flex:none;cursor:pointer}
.avw .st{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid #fff;z-index:2}
.avs{display:inline-flex;align-items:center}
.avs .avw+.avw,.avs .avw+.av{margin-left:-9px}
.men{color:var(--azul);font-weight:700;background:var(--azul-10);border-radius:6px;padding:0 4px}
.flag{font-size:12px;font-weight:700}
/* anel */
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;font-family:var(--kanit);font-weight:600;color:var(--ink)}
/* barra */
.bar{height:8px;background:#ECEDF5;border-radius:99px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--azul);border-radius:99px}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sq{width:18px;height:18px;border-radius:6px;border:2px solid;display:inline-block;flex:none;cursor:pointer;position:relative;background:#fff}
.sq.done{background:var(--azul);border-color:var(--azul)!important}
.sq.done::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
/* segmentado */
.seg,.subviews{display:inline-flex;gap:4px;background:#fff;padding:4px;border-radius:14px;box-shadow:var(--shadow);flex-wrap:wrap}
.seg button,.subviews button{border:0;background:none;padding:7px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:10px;display:inline-flex;gap:6px;align-items:center;font-size:14px}
.seg button.on,.subviews button.on{background:var(--azul-10);color:var(--azul)}
.seg button .n{background:var(--soft);color:var(--muted);border-radius:999px;font-size:11.5px;padding:0 7px}
.seg button.on .n{background:var(--azul);color:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px}
.filters input[type=search]{flex:1;min-width:220px}
/* dashboard */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.rcard{display:flex;gap:18px;align-items:center;cursor:pointer}
.rcard .nm{font-weight:800;font-size:16px;line-height:1.2}
.rcard .sub{font-size:13.5px;margin-top:2px}
.rcard .tr{margin-top:8px;font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.scard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.scard .l{font-weight:700;font-size:14px}
.scard .s{font-size:12.5px;color:var(--muted)}
.scard.hl{background:var(--azul);color:#fff}
.scard.hl .l,.scard.hl .s{color:#fff}
.scard.hl .ring b{color:#fff}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kcol{background:var(--soft);border-radius:18px;padding:12px;min-height:200px}
.kcol h5{margin:2px 4px 12px;font-family:var(--kanit);font-weight:500;font-size:16px;display:flex;align-items:center;gap:8px}
.kcol h5 .cnt{background:#fff;color:var(--muted);font-family:Urbanist,sans-serif;font-size:12px;font-weight:700;padding:0 8px;border-radius:999px}
.kt{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;border:1px solid transparent;box-shadow:0 1px 2px rgba(20,21,60,.04)}
.kt:hover{border-color:var(--azul-20)}
.kt .t{font-weight:700;font-size:14px;line-height:1.3;display:flex;gap:8px;justify-content:space-between}
.kt .ft{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--muted)}
.kt .ft span{display:inline-flex;gap:5px;align-items:center}
.okc{width:20px;height:20px;border-radius:50%;background:#12B76A;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cal .hd{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal .hd b{font-family:var(--kanit);font-weight:500;font-size:18px;flex:1;text-transform:capitalize}
.cal .hd button{border:0;background:var(--soft);width:30px;height:30px;border-radius:50%;cursor:pointer;font-weight:700;color:var(--muted)}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .g .w{font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.cal .g .d{position:relative;padding:7px 0;font-size:13.5px;border-radius:10px;cursor:pointer;font-weight:600}
.cal .g .d:hover{background:var(--soft)}
.cal .g .d.out{color:#C2C4D3}
.cal .g .d.today{background:var(--azul-10);color:var(--azul)}
.cal .g .d.sel{background:var(--azul);color:#fff}
.cal .g .d i{position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--azul)}
.cal .g .d i.late{background:var(--danger)}.cal .g .d i.g{background:#1A73E8}
.cal .g .d.sel i{background:#fff}
.agenda{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.agenda h6{margin:0 0 10px;font-size:15px;font-weight:800}
.ag{display:flex;gap:10px;padding:6px 0;cursor:pointer}
.ag .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.ag .tt{font-weight:700;font-size:14px;line-height:1.25}
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:26px}
.chart .cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;position:relative}
.chart .stack{width:100%;max-width:44px;display:flex;flex-direction:column-reverse;border-radius:12px;overflow:hidden;min-height:8px;background:var(--azul-10)}
.chart .done{background:var(--azul)}
.chart .pend{background:var(--azul-20)}
.chart .cb.today .done{background:var(--preto)}
.chart .cb.today .pend{background:#9A9CB0}
.chart .lbl{font-size:12.5px;color:var(--muted);font-weight:700}
.chart .cb.today .lbl{color:var(--ink)}
.chart .tip{position:absolute;font-size:11.5px;font-weight:700;padding:1px 7px;background:#fff;border-radius:999px;box-shadow:var(--shadow)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:3px}
.team .it{display:flex;gap:12px;align-items:center;padding:9px 0}
.team .nm{font-weight:700;font-size:14px}
.team .av{width:38px;height:38px;font-size:13px}
.gauge{display:flex;flex-direction:column;align-items:center}
.dark{background:var(--preto);color:#fff;overflow:hidden}
.dark h3{color:#fff}
.dark .big{font-family:var(--kanit);font-size:50px;font-weight:600;line-height:1}
.dark::after{content:"";position:absolute;right:-50px;bottom:-50px;width:170px;height:170px;border:30px solid var(--azul);border-radius:50%}
.dark .btn{background:#fff;color:var(--preto);border-color:#fff;position:relative;z-index:1}
/* linhas (processos / propostas) */
.rows{display:flex;flex-direction:column;gap:10px;margin-bottom:40px}
.rowc{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px 18px;display:grid;grid-template-columns:minmax(220px,2.3fr) minmax(130px,1.1fr) minmax(90px,.8fr) minmax(150px,1.4fr) minmax(100px,1fr) minmax(90px,.9fr) auto;gap:16px;align-items:center;cursor:pointer;border:1px solid transparent;transition:border-color .15s}
.rowc:hover{border-color:var(--azul-20)}
.rowc .nm{font-weight:800;font-size:15.5px;line-height:1.25}
.rowc .lb{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.rowc .vv{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.rowc .acts{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.rowc .acts a{color:var(--azul);display:inline-flex}
.rowc.prop{grid-template-columns:minmax(240px,2.4fr) minmax(120px,1fr) minmax(150px,1.2fr) minmax(110px,.9fr) minmax(190px,1.5fr)}
@media (max-width:1250px){.rowc,.rowc.prop{grid-template-columns:1fr 1fr 1fr}.rowc>div:first-child{grid-column:1/-1}}
.alerts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.acard{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;cursor:pointer;border:2px solid transparent;position:relative}
.acard:hover{border-color:var(--azul-20)}
.acard.on{border-color:var(--azul)}
.acard .top2{display:flex;justify-content:space-between;align-items:center}
.acard .ico{width:36px;height:36px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.acard .w{font-size:12px;font-weight:700;color:var(--danger);display:flex;gap:5px;align-items:center}
.acard .v{font-family:var(--kanit);font-size:34px;font-weight:600;line-height:1;margin-top:12px}
.acard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:4px;color:#4B4E66;font-size:14px;font-weight:600}
/* árvore */
.pwrap{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.pmain{min-width:0}
.tree{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding:12px;margin-bottom:40px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow)}
.tree input{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13.5px;background:var(--soft)}
.tnode{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--ink);font-weight:600}
.tnode:hover{background:var(--soft)}
.tnode.on{background:var(--azul-10);color:var(--azul)}
.tnode.leaf{padding-left:32px;color:#4B4E66;font-weight:500}
.tnode.leaf.on{color:var(--azul);font-weight:700}
.tnode .car{width:14px;color:var(--muted);font-size:12px;text-align:center}
.tnode .ti{width:18px;text-align:center;color:var(--muted)}
.tnode .tn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .tc{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--soft);border-radius:999px;padding:0 7px}
.tnode .tc:empty{display:none}
.tsep{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:12px 10px 4px}
.crumb{font-size:14px;margin:-6px 0 14px;color:var(--muted)}
.crumb b{color:var(--ink)}
/* quadro de processos */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:40px}
.col{background:rgba(255,255,255,.55);border-radius:18px;padding:12px;min-height:340px}
.col.over{outline:2px dashed var(--azul);outline-offset:-2px}
.col h5{margin:2px 4px 12px;font-family:var(--kanit);font-weight:500;font-size:15.5px;display:flex;align-items:center;gap:8px}
.kcard{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:grab;box-shadow:0 1px 2px rgba(20,21,60,.05)}
.kcard:hover{outline:1px solid var(--azul-20)}
.kcard .t{font-weight:800;font-size:14.5px;line-height:1.3}
.kcard .meta{display:flex;align-items:center;gap:8px;margin-top:10px;justify-content:space-between}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(14,16,48,.35);display:none;z-index:20;backdrop-filter:blur(2px)}
.overlay.on{display:block}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(880px,calc(100% - 20px));background:var(--bg);z-index:21;transform:translateX(110%);transition:transform .22s ease;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(14,16,48,.25)}
.drawer:not(.on){display:none}.drawer.on{transform:none;animation:dslide .22s ease}@keyframes dslide{from{transform:translateX(40px);opacity:0}}
.dhead{padding:18px 22px;display:flex;gap:10px;align-items:flex-start;background:#fff}
.dhead h2{margin:2px 0 0;font-size:24px;font-family:var(--kanit);font-weight:600;line-height:1.1}
.dhead .sub{font-size:13px}
.dhead a.link{text-decoration:underline}
.dhead .btn.ghost{width:38px;height:38px;border-radius:50%;justify-content:center;background:var(--soft);padding:0}
.tabs{display:flex;gap:4px;padding:4px;background:#fff;border-radius:14px;overflow-x:auto;box-shadow:var(--shadow);flex:none}
.tab{padding:8px 13px;border:0;background:none;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:700;border-radius:10px;font-size:14px}
.tab.on{color:var(--azul);background:var(--azul-10)}
.tab .n{background:var(--azul);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}
.dbody{flex:1;overflow:auto;padding:18px 22px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:700}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:500;color:var(--ink);background:#fff;width:100%}
/* tarefas dentro do processo */
.tlist{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.tgh{padding:10px 16px 6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:8px;align-items:center}
.trow{display:grid;grid-template-columns:20px 1fr auto 74px auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;background:#fff}
.trow:hover{background:#FAFAFE}
.trow .tt{font-weight:700;font-size:14px}
.trow .tt.done{text-decoration:line-through;color:var(--muted)}
.trow .ic{color:var(--muted)}
.trow .icn{font-size:12px;color:var(--muted);display:inline-flex;gap:10px;margin-left:8px;font-weight:600;align-items:center}
.addrow{display:flex;gap:8px;padding:10px 16px;background:#fff;border-top:1px solid var(--line)}
.addrow input{flex:1;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--soft)}
/* modal tarefa */
.mlayer{position:fixed;inset:0;background:rgba(14,16,48,.4);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:24px;width:min(1080px,100%);box-shadow:0 24px 70px rgba(14,16,48,.3);display:flex;flex-direction:column;max-height:92vh;overflow:hidden}
.modal.small{width:min(540px,100%)}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.mbody{display:grid;grid-template-columns:1.35fr 1fr;min-height:0;flex:1}
.mleft{padding:20px 24px;overflow:auto}
.mright{display:flex;flex-direction:column;background:var(--soft);min-height:0;border-radius:18px;margin:12px 12px 12px 0}
.ttitle{font-family:var(--kanit);font-size:24px;font-weight:600;border:1px solid transparent;border-radius:10px;padding:4px 8px;margin:0 0 12px -8px;width:calc(100% + 8px)}
.ttitle:hover{border-color:var(--line)}
.props{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;align-items:center;margin-bottom:18px;font-size:13.5px}
.props .k{color:var(--muted);font-weight:700;font-size:12.5px}
.props select,.props input{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
.stsel{font-weight:700;border-width:0!important;color:#fff;cursor:pointer}
.whopick{display:flex;flex-wrap:wrap;gap:6px}
.whopick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 12px 2px 2px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600}
.whopick button.on{border-color:var(--azul);background:var(--azul-10);color:var(--azul)}
.whopick button:not(.on) .av{filter:grayscale(1);opacity:.5}
.subs{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{display:grid;grid-template-columns:20px 1fr 120px 128px 24px;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.srow input.st{border:1px solid transparent;border-radius:8px;padding:5px 7px;width:100%}
.srow input.st:hover,.srow input.st:focus{border-color:var(--line)}
.srow.done input.st{text-decoration:line-through;color:var(--muted)}
.srow select,.srow input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12.5px;background:#fff;width:100%}
.srow .x,.tmft .x{border:0;background:none;color:#98a2b3;cursor:pointer;font-size:15px}
.feedtabs{display:flex;gap:4px;padding:10px 12px 0}
.feed{flex:1;overflow:auto;padding:14px;min-height:180px}
.cm{display:flex;gap:10px;margin-bottom:14px}
.cm .bx{flex:1;background:#fff;border-radius:14px;padding:10px 13px}
.cm .hd{display:flex;gap:8px;align-items:baseline;font-size:12.5px;margin-bottom:3px}
.cm .hd b{font-size:14px}
.cm .tx{white-space:pre-wrap;font-size:14px}
.cm .asg{margin-top:8px;font-size:12.5px;display:flex;align-items:center;gap:8px;background:var(--amarelo-20);border-radius:10px;padding:6px 9px}
.cm .asg.ok{background:#E3F8EC}
.act{font-size:12.5px;color:var(--muted);margin:0 0 10px;display:flex;gap:8px}
.act b{color:var(--ink);font-weight:700}
.composer{padding:12px;position:relative}
.composer textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:66px;resize:vertical;background:#fff}
.composer .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.composer select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;font-size:13px}
.mentions{position:absolute;bottom:100%;left:12px;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(14,16,48,.2);padding:5px;z-index:5;min-width:220px}
.mentions div{padding:6px 8px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13.5px}
.mentions div:hover,.mentions div.on{background:var(--azul-10)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
@media (max-width:860px){.mlayer{padding:0}.modal{max-height:none;border-radius:0;min-height:100vh}.mbody{display:block}.mleft{overflow:visible}.mright{margin:0 12px 12px}.mhead span:not(.spacer){display:none}.trow{grid-template-columns:20px 1fr auto}.trow .hidem{display:none}}
@media (max-width:620px){.srow{grid-template-columns:20px 1fr 24px}.srow select,.srow input[type=date]{grid-column:2}}
/* notificações e popover */
.npanel{position:fixed;top:72px;right:24px;width:min(400px,calc(100% - 32px));max-height:70vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(14,16,48,.22);z-index:35}
.npanel .h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-family:var(--kanit);font-weight:500;font-size:17px}
.ni{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.ni:hover{background:var(--soft)}
.ni.unread{background:var(--azul-10)}
.ni .when{font-size:12px;color:var(--muted)}
.pop{position:fixed;z-index:50;width:330px;background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(14,16,48,.25);overflow:hidden}
.pop .hd{display:flex;gap:14px;padding:16px;background:var(--soft)}
.pop .ph,.tcard .ph,.photoedit .ph{border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--kanit);color:#fff;flex:none}
.pop .ph{width:80px;height:80px;font-size:28px}
.pop .ph img,.tcard .ph img,.photoedit .ph img{width:100%;height:100%;object-fit:cover}
.pop .nm{font-family:var(--kanit);font-size:18px;font-weight:600;line-height:1.1}
.pop .bd{padding:12px 16px}
.pop .ln{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.pop .ln a{color:var(--ink);text-decoration:none}
.pop .ln a:hover{color:var(--azul)}
.pop select{border:1px solid var(--line);padding:4px 8px;background:#fff;font-size:13px;border-radius:8px}
.photoedit{display:flex;gap:16px;align-items:center}
.photoedit .ph{width:96px;height:96px;font-size:34px}
/* minhas tarefas */
.mine-row{display:grid;grid-template-columns:20px 1fr auto auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;background:#fff}
.mine-row:hover{background:#FAFAFE}
.kind{margin-right:6px}
/* equipe */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.tcard{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tcard .ph{width:100px;height:100px;font-size:34px;border-radius:24px}
.tcard .nm{font-family:var(--kanit);font-size:19px;font-weight:600;margin-top:12px;line-height:1.15}
.tcard .chips{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap;justify-content:center}
.tcard .info{width:100%;background:var(--soft);border-radius:14px;padding:4px 12px;margin-top:12px;text-align:left}
.tcard .row{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 0;color:var(--muted);overflow:hidden;border-bottom:1px solid #fff}
.tcard .row:last-child{border-bottom:0}
.tcard .row a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tcard .row a:hover{color:var(--azul)}
.tcard .rings{display:flex;justify-content:space-around;width:100%;margin-top:14px}
.tcard .rings div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
/* textos ricos, drive, tramitação */
.rt{font-size:14.5px;line-height:1.55}
.rt ul,.rt ol{margin:4px 0 8px;padding-left:22px}
.rt p,.rt div{margin:0 0 6px}
.rt a{color:var(--azul);font-weight:600}
.rt h3{font-size:15px;margin:12px 0 6px}
.editor{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.edbar{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;background:var(--soft)}
.edbar button{border:0;background:none;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:14px;min-width:30px}
.edbar button:hover{background:#fff}
.edbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.edarea{min-height:220px;padding:12px 14px;outline:none}
.edarea:empty::before{content:attr(data-ph);color:#98a2b3}
.linkrow{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--line)}
.linkrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.imv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.drivebox{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--soft)}
.drivebox .ico{width:46px;height:46px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.lk{display:grid;grid-template-columns:1fr 1.6fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.lk:last-child{border-bottom:0}
.lk input{border:1px solid var(--line);border-radius:10px;padding:7px 9px;width:100%}
@media (max-width:620px){.lk{grid-template-columns:1fr auto}.lk input{grid-column:1/-1}}
.tm{display:flex;gap:12px;position:relative;padding-bottom:12px}
.tm:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.tmdot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.tmbox{flex:1;border-radius:14px;padding:10px 14px;background:var(--soft);font-size:14px;min-width:0}
.tmft{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
details.sect summary{cursor:pointer;font-family:var(--kanit);font-weight:500;font-size:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--preto);color:#fff;padding:11px 20px;border-radius:14px;z-index:60;font-weight:600;box-shadow:0 10px 30px rgba(14,16,48,.3)}
/* tabelas remanescentes */
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
/* responsivo */
@media (max-width:1280px){.c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c8,.c7,.c9{grid-column:span 12}}
@media (max-width:1180px){.app{grid-template-columns:76px 1fr}.side{padding:18px 10px}.side .logo,.side .leg,.nav .tx,.sidebox{display:none}.nav{justify-content:center;padding:12px 0;position:relative}.nav .n{position:absolute;top:0;right:2px;margin:0}
  .pwrap{grid-template-columns:1fr}.tree{position:static;max-height:280px}}
@media (max-width:760px){.app{display:block}.side{position:sticky;top:0;z-index:16;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.nav{width:auto;padding:10px 14px}
  .top{padding:12px 14px 0}.chip-me .tx{display:none}.gsearch{display:none}.content{padding:16px 14px 40px}
  .c3,.c4,.c5,.c6{grid-column:span 12}.pagehead h1{font-size:26px}.pagehead h1.big{font-size:32px}.kanban{grid-template-columns:1fr}.alerts{grid-template-columns:1fr}
  .rowc,.rowc.prop{grid-template-columns:1fr 1fr}}
/* ===== v7: estilo OripioFin/Quixotic com a identidade Mannare ===== */
:root{--bg:#EEEEF1;--canvas:#F6F6F8;--line:#E7E7EC;--shadow:none;--r-lg:18px}
body{background:var(--bg)}
.app{grid-template-columns:260px 1fr;background:var(--canvas)}
.blk,.card,.sect,.tree,.rowc,.acard,.tlist,.tcard,.seg,.subviews,.tabs{box-shadow:none!important;border:1px solid var(--line)!important}
.side{background:#fff;padding:22px 18px;gap:2px}
.side .logo{margin:2px 6px 20px}
.sside{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px;color:var(--muted);background:#FAFAFB}
.sside input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:14px}
.sside kbd{font:600 11px Urbanist,sans-serif;border:1px solid var(--line);border-radius:6px;padding:0 5px;background:#fff;color:var(--muted)}
.side .leg{letter-spacing:.06em;font-weight:600;margin:16px 10px 6px;font-size:11.5px}
.nav{color:#2B2D42;font-weight:500;padding:10px 12px}
.nav .ic{opacity:.85}
.nav.on{background:linear-gradient(100deg,#0B0B1A 0%,#26283A 70%,#3A3C52 100%);color:#fff;box-shadow:0 6px 16px rgba(11,11,26,.18)}
.nav .n{background:#F0F0F4;color:#4B4E66;font-weight:700}
.nav.on .n{background:rgba(255,255,255,.18);color:#fff}
.nav .n.red{background:#FDE8E7;color:#B42318}
.sidebox{background:#F4F4F7;border:1px solid var(--line)}
.sidebox::after{background:var(--azul-10)}
.sidebox b{color:var(--ink)}
.top{padding:16px 30px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.navbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.navbtn:hover{color:var(--ink);border-color:#C9CAD6}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-left:6px}
.crumbs b{color:var(--ink);font-weight:600}
.iconbtn{width:42px;height:42px;border-radius:12px}
.chip-me{border-radius:14px;padding:4px 10px 4px 4px}
.chip-me .av{width:36px;height:36px;font-size:12px}
.content{padding:26px 30px 48px}
.pagehead h1{font-size:30px}
.pagehead h1.welcome{font-size:40px;font-weight:500}
.pagehead h1.welcome span{color:#9A9CB0}
.btn{border-radius:12px}
.btn.primary{background:var(--azul);box-shadow:0 6px 14px rgba(0,0,255,.18)}
.seg{border-radius:999px;padding:4px;background:#F2F2F5;border:0!important}
.seg button{border-radius:999px}
.seg button.on{background:var(--azul);color:#fff}
.seg button.on .n{background:rgba(255,255,255,.25);color:#fff}
.seg.sm button{padding:6px 14px;font-size:13px}
.blk{padding:20px 22px}
.blk h3{font-size:19px}
.more{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);background:#fff;flex:none}
.more:hover{border-color:var(--azul-40);color:var(--azul)}
/* cartões de saldo */
.ccard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
.ccard .ch{display:flex;align-items:center;gap:12px;padding:16px 18px 0}
.ccard .cico{width:42px;height:42px;border-radius:12px;background:#F2F2F6;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink);border:1px solid var(--line)}
.cico.sm{width:34px;height:34px;border-radius:10px;border:0}
.ccard .ct{font-family:var(--kanit);font-size:19px;font-weight:500;line-height:1.15}
.ccard .csub{font-size:13px;color:var(--muted)}
.ccard .cbody{padding:16px 18px 18px;flex:1}
.ccard .cl{font-size:13.5px;opacity:.85;margin-bottom:4px}
.ccard .cv{font-family:var(--kanit);font-size:34px;font-weight:500;line-height:1.1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ccard .chip{font:700 12px Urbanist,sans-serif;background:#E3F8EC;color:#067647;border-radius:999px;padding:2px 9px}
.ccard .chip.red{background:#FDE8E7;color:#B42318}
.ccard .cs{font-size:13px;color:var(--muted);margin-top:6px}
.ccard .cf{border-top:1px solid var(--line);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;cursor:pointer;color:#2B2D42}
.ccard .cf:hover{background:#FAFAFC}
.ccard.hero{background:radial-gradient(120% 140% at 85% 0%,#3333FF 0%,#0000FF 45%,#0000C8 100%);color:#fff;border-color:#0000E0}
.ccard.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:linear-gradient(120deg,transparent 20%,#000 70%);mask-image:linear-gradient(120deg,transparent 20%,#000 70%);pointer-events:none}
.ccard.hero>*{position:relative}
.ccard.hero .hlogo{height:34px;width:auto;max-width:70%}
.ccard.hero .more{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.ccard.hero .cs,.ccard.hero .csub{color:rgba(255,255,255,.8)}
.ccard.hero .chip{background:rgba(255,255,255,.18);color:#fff}
.ccard.hero .cf{border-top-color:rgba(255,255,255,.18);color:#fff}
.ccard.hero .cf:hover{background:rgba(255,255,255,.06)}
.ccard.hero.alt{background:radial-gradient(120% 140% at 85% 0%,#2A2C40 0%,#0B0B1A 70%);border-color:#0B0B1A}
.ccard.hero .cico.w{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
/* minha semana */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#F6F6F8;border-radius:14px;padding:14px 16px;cursor:pointer;border:1px solid transparent}
.tile:hover{border-color:var(--line);background:#fff}
.tile .th{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.tile .tdot{width:10px;height:10px;border-radius:50%}
.tile .tv{font-family:var(--kanit);font-size:30px;font-weight:500;margin:6px 0 0;line-height:1.1}
.tile .ts{font-size:12px;color:var(--muted)}
/* gráfico de barras */
.bign{font-family:var(--kanit);font-size:32px;font-weight:500;line-height:1.15}
.bars{display:flex;align-items:flex-end;gap:12px;margin-top:18px;padding-left:4px}
.bars .yax{display:flex;flex-direction:column;justify-content:space-between;height:170px;margin-bottom:26px;font-size:12px;color:var(--muted);min-width:22px;text-align:right}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.bars .bw{width:100%;position:relative;display:flex;align-items:flex-end;justify-content:center}
.bars .b{width:100%;max-width:62px;border-radius:999px;background:repeating-linear-gradient(135deg,#E3E3F6 0 6px,#EEEEFA 6px 12px);position:relative;overflow:hidden;display:flex;align-items:flex-end}
.bars .b i{display:block;width:100%;background:linear-gradient(180deg,#CCCCFF,#B3B3FF)}
.bars .bc.cur .b{background:repeating-linear-gradient(135deg,#1A1AFF 0 6px,#0000F0 6px 12px)}
.bars .bc.cur .b i{background:linear-gradient(180deg,#0000FF 0%,#0000C8 100%)}
.bars .bl{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:capitalize}
.bars .bc.cur .bl{color:var(--ink);font-weight:800}
.btip{position:absolute;left:50%;transform:translateX(-10%);background:#14152B;color:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;z-index:2;min-width:150px;box-shadow:0 10px 24px rgba(11,11,26,.25)}
.btip div{display:flex;justify-content:space-between;gap:12px}
.bdot{position:absolute;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;border:4px solid var(--azul);z-index:1}
/* tabela de atividades */
.minis{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:7px 12px;font:500 14px Urbanist,sans-serif;color:var(--muted)}
.minis input{border:0;outline:0;background:none;width:160px}
table.atable{width:100%;border-collapse:separate;border-spacing:0;min-width:820px;font-size:14px}
table.atable th{background:#F6F6F8;color:var(--muted);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
table.atable th:first-child{border-radius:12px 0 0 0}table.atable th:last-child{border-radius:0 12px 0 0}
table.atable td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.atable tbody tr{cursor:pointer}
table.atable tbody tr:hover td{background:#FAFAFC}
.cbx{display:inline-block;width:17px;height:17px;border:1.5px solid #C9CAD6;border-radius:5px;background:#fff}
.actt{display:flex;gap:10px;align-items:center}
.aico{width:30px;height:30px;border-radius:9px;background:#F2F2F6;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sdot{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}

.pldot{width:6px;height:6px;border-radius:50%;flex:none}
.plt{flex:1;min-width:0;cursor:pointer}.plt b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plt span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plt i{font-style:normal}.plt i.late{color:#D92D20;font-weight:700}.plt i.hoje{color:#B54708;font-weight:700}.plt i.ok{color:#067647}
.plx{border:0;background:none;color:#98a2b3;cursor:pointer;opacity:0}.pli:hover .plx{opacity:1}
.pladd{width:calc(100% - 16px);margin:4px 8px;border:1px dashed var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;color:var(--muted);background:#fff}
.plcal{background:var(--card,#fff);border:1px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;min-width:0}
.pltop{display:flex;align-items:center;gap:8px;margin-bottom:8px}.pltop h3{margin:0 6px;font:500 19px var(--kanit);color:var(--ink)}.pltop .iconbtn{font-size:20px;line-height:1}
.plgrid{flex:1;display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pgh,.pga{display:grid;grid-template-columns:56px repeat(var(--n),1fr);border-bottom:1px solid var(--line)}
.ptz{font-size:10.5px;color:var(--muted);padding:6px 4px;text-align:right}
.pdh{text-align:center;padding:8px 4px;font-size:13px;color:var(--muted);cursor:pointer;border-left:1px solid var(--line)}.pdh b{color:var(--ink);font-weight:600;margin-left:2px}
.pdh.hoje b{background:#D92D20;color:#fff;border-radius:999px;padding:1px 7px}
.pad{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;max-height:78px;overflow:auto;min-height:26px}
.plad{border:1px solid var(--c);color:var(--c);background:#fff;border-radius:6px;font-size:11.5px;font-weight:600;padding:2px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.plad.done{opacity:.5;text-decoration:line-through}
.pgb{flex:1;min-height:0;overflow:auto;display:grid;align-items:start;grid-template-columns:56px repeat(var(--n),1fr);position:relative}
.phrs{position:relative;height:1152px}.phrs div{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.pnowl{position:absolute;right:2px;transform:translateY(-50%);background:#D92D20;color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px;z-index:3}
.pday{position:relative;height:1152px;border-left:1px solid var(--line);cursor:copy}
.pday.fds{background:repeating-linear-gradient(135deg,#fafafc 0 6px,#f4f5f9 6px 7px)}
.phr{position:absolute;left:0;right:0;border-top:1px solid #eef0f4}
.pday.drop::after{content:'';position:absolute;left:2px;right:2px;top:var(--dropy);height:48px;border:2px dashed var(--azul);border-radius:8px;background:rgba(0,0,255,.06);pointer-events:none}
.pnow{position:absolute;left:0;right:0;border-top:2px solid #D92D20;z-index:3;pointer-events:none}.pnow::before{content:'';position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:#D92D20}
.pev{position:absolute;border-radius:8px;padding:3px 7px;font-size:11.5px;overflow:hidden;z-index:2;cursor:pointer;display:flex;flex-direction:column;gap:1px;line-height:1.25}
.pev b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pev span{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pev.curto{flex-direction:row;align-items:center;gap:6px}
.pev.reu{background:#EEF1F6;border-left:3px solid #8C9BB5;color:#475467;cursor:default}
.pevlink{margin-top:auto;align-self:flex-start;display:inline-flex;gap:4px;align-items:center;background:#0000FF;color:#fff!important;border-radius:6px;padding:2px 7px;font-weight:700;text-decoration:none;font-size:11px}
.pev.curto .pevlink{margin:0 0 0 auto}
.pev.estreito{padding:3px 4px}.pev.estreito span{display:none}
.pev.blk{background:color-mix(in srgb,var(--c) 12%,#fff);border-left:3px solid var(--c);color:var(--ink)}.pev.blk b{color:var(--c)}
.pev.blk.done{opacity:.55}.pev.blk.done b{text-decoration:line-through}
.prz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
@media (max-width:1000px){.plan{grid-template-columns:1fr;height:auto}.plside{max-height:320px}.plcal{height:80vh}}
</style>

<style id="mannare-ds">
/* ==========================================================================
   MANNARE DESIGN SYSTEM | tokens + camada visual (estilo Linear, identidade Mannare)
   Só estilo: nenhuma regra aqui muda estrutura, textos ou comportamento.
   ========================================================================== */
:root{
  /* marca */
  --m-azul:#0000FF;    --m-azul-80:#3333FF;   --m-azul-60:#6666FF;   --m-azul-40:#9999FF;   --m-azul-20:#CCCCFF;
  --m-ciano:#00D2FF;   --m-ciano-80:#33DBFF;  --m-ciano-60:#66E4FF;  --m-ciano-40:#99EDFF;  --m-ciano-20:#CCF6FF;
  --m-amarelo:#FDCA40; --m-amarelo-80:#FDD566;--m-amarelo-60:#FEDF8C;--m-amarelo-40:#FEEAB3;--m-amarelo-20:#FFF4D9;
  --m-preto:#000000;   --m-branco:#FFFFFF;
  --m-azul-hover:#0000CC;
  /* translúcidos (badges, seleção, hover) */
  --m-azul-t10:rgba(0,0,255,.10); --m-azul-t20:rgba(0,0,255,.20); --m-azul-t05:rgba(0,0,255,.05);
  --m-ciano-t15:rgba(0,210,255,.15); --m-ciano-t40:rgba(0,210,255,.40);
  --m-amarelo-t25:rgba(253,202,64,.25); --m-amarelo-t50:rgba(253,202,64,.50);
  /* neutros (slate, frios) */
  --z-50:#F8FAFC; --z-100:#F1F5F9; --z-200:#E2E8F0; --z-300:#CBD5E1; --z-400:#94A3B8; --z-500:#64748B; --z-600:#475569; --z-700:#334155; --z-900:#0F172A; --z-950:#020617;
  /* papéis de interface */
  --ui-bg:#F8FAFC; --ui-surface:#FFFFFF; --ui-panel:#FFFFFF;
  --ui-border:#E2E8F0; --ui-border-strong:var(--z-300);
  --ui-text:#0F172A; --ui-text-2:var(--z-500);
  --ui-hover:var(--z-50); --ui-accent:var(--m-azul); --ui-focus:var(--m-azul);
  --ok:#067647; --danger:#B42318; --warn:#000000;
  /* tipografia */
  --font-display:Kanit,"Forma DJR Display",Inter,system-ui,sans-serif;
  --font-sub:"Forma DJR Display",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-sans:"Forma DJR Display",Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  /* forma */
  --radius:6px; --radius-lg:8px; --radius-pill:999px; --shadow:none;
  /* aliases usados pelo código existente (não renomear) */
  --azul:var(--m-azul); --azul-80:var(--m-azul-80); --azul-60:var(--m-azul-60); --azul-40:var(--m-azul-40); --azul-20:var(--m-azul-20); --azul-10:var(--m-azul-t05);
  --ciano:var(--m-ciano); --ciano-20:var(--m-ciano-20); --amarelo:var(--m-amarelo); --amarelo-20:var(--m-amarelo-20); --preto:var(--m-preto);
  --navy:var(--m-azul); --indigo:var(--m-azul); --indigo-soft:var(--m-azul-t05);
  --bg:var(--ui-bg); --panel:var(--ui-panel); --ink:var(--ui-text); --muted:var(--ui-text-2); --line:var(--ui-border); --soft:var(--ui-surface);
  --r-lg:8px; --r:6px; --r-sm:6px; --kanit:var(--font-display);
}
/* tema escuro pronto (o CRM ainda não tem seletor de tema): <html class="dark"> ou data-theme="dark" */
:root.dark,:root[data-theme="dark"]{
  --ui-bg:#000000; --ui-surface:var(--z-950); --ui-panel:var(--z-900);
  --ui-border:rgba(255,255,255,.10); --ui-border-strong:rgba(255,255,255,.18);
  --ui-text:#FFFFFF; --ui-text-2:var(--z-400); --ui-hover:rgba(255,255,255,.03);
  --ui-accent:var(--m-ciano); --ui-focus:var(--m-ciano);
  --azul-10:rgba(0,210,255,.08); --soft:var(--ui-surface);
}

/* ---------- base ---------- */
*,*::before,*::after{border-radius:0!important;box-shadow:none!important;text-shadow:none!important}
html,body{background:var(--ui-bg)}
body{font:14px/1.5 var(--font-sans);color:var(--ui-text);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
a{color:var(--ui-accent)}
::selection{background:var(--m-azul-t20)}
:focus{outline:none}
:focus-visible{outline:1px solid var(--ui-focus)!important;outline-offset:0!important}
input:focus,select:focus,textarea:focus{border-color:var(--ui-focus)!important;outline:none}
button,a,.btn,.nav,input,select,textarea,.trow,.mine-row,.pli,.dcom,.li,.rowc,.mcard,.ccard,.tab,.seg button{transition:background-color .15s,border-color .15s,color .15s!important}
.ic{width:16px!important;height:16px!important;vertical-align:-3px}
.ic.sm{width:16px!important;height:16px!important}
/* pílulas e indicadores: únicas exceções aos cantos retos */
.badge,.nav .n,.blk h3 .cnt,.stchip,.seg button .n,.kcol h5 .cnt,.tab .n,.ccard .chip,.tmr,.gchip,.sync,.fpill,.ftag,.apb,.plst .n,.pdh.hoje b,.pnowl,.chip,.tag,.pill,.n.red,
.pill i,.stchip i,.avw .st,.cal .g .d i,.ag .dot,.tmdot,.tile .tdot,.bdot,.sdot i,.tmr.on i,.toptimer i,.pldot,.pnow::before,i.st-online,i.st-offline,.okc{border-radius:999px!important}

/* ---------- tipografia ---------- */
.pagehead h1,.dhead h2,.mhead b,.plhead h2,.pltop h3,h1,h2{font-family:var(--font-display)!important;text-transform:uppercase;letter-spacing:-.01em!important;font-weight:600!important;color:var(--ui-text)}
.pagehead h1{font-size:26px!important;line-height:1.1!important}
.pagehead p{color:var(--ui-text-2);font-size:13px;font-family:var(--font-sans)}
.blk h3,.sect h4{font-family:var(--font-display)!important;text-transform:uppercase;letter-spacing:-.005em!important;font-weight:600!important;font-size:14px!important;color:var(--ui-text)}
.mhead b{font-size:15px!important}
.acard .v,.ccard .big,.dark .big,.ccard .v,.kpi .v,.fk .v,.big{font-family:var(--font-display)!important;letter-spacing:-.02em!important;font-weight:600!important;color:inherit}
.side .leg,.tgh,.plst,.mhd,.sub.mhd,table.atable th,.ptz,.kcol h5,.cal .hd b{font-size:11px!important;letter-spacing:.12em!important;text-transform:uppercase;font-weight:600!important;color:var(--ui-text-2)!important}
.tgh{color:var(--ui-text)!important}
.sub,.hint{color:var(--ui-text-2)}
.hint{font-size:12.5px}

/* ---------- layout / navegação ---------- */
.app{background:var(--ui-bg)}
.side{background:var(--ui-surface)!important;border-right:1px solid var(--ui-border)!important;padding:20px 12px!important}
.side .logo{margin:4px 8px 22px!important}
.nav{border-radius:0!important;padding:8px 12px!important;font-size:14px!important;font-weight:500!important;color:var(--z-600)!important;border-left:2px solid transparent!important;gap:10px!important}
.nav:hover{background:var(--z-100)!important;color:var(--ui-text)!important}
.nav.on{background:transparent!important;color:var(--ui-accent)!important;border-left-color:var(--ui-accent)!important;font-weight:600!important}
.nav.on .ic{color:var(--ui-accent)}
.nav .n,.nav.on .n{background:var(--m-azul-t10)!important;color:var(--m-azul)!important;border:1px solid var(--m-azul-t20)}
.nav .n.red,.n.red,.nav .red{background:#FEF3F2!important;color:var(--danger)!important;border:1px solid #FECDCA}
.sidebox{background:var(--ui-panel)!important;border:1px solid var(--ui-border)!important}
.sidebox::after,.dark::after,.ccard.hero::before{display:none!important;background:none!important}
.top,.topbar,header.top{background:var(--ui-bg)!important;border-bottom:1px solid var(--ui-border)!important}
.iconbtn{background:var(--ui-panel)!important;border:1px solid var(--ui-border)!important;color:var(--ui-text)}
.iconbtn:hover{background:var(--ui-hover)!important}
.gsearch{background:var(--ui-panel)!important;border:1px solid var(--ui-border)!important}
.chip-me{background:var(--ui-panel)!important;border:1px solid var(--ui-border)!important}

/* ---------- botões ---------- */
.btn{border:1px solid var(--z-200)!important;background:var(--ui-panel)!important;color:var(--ui-text)!important;padding:7px 12px!important;font-size:13.5px!important;font-weight:600!important;gap:6px!important}
.btn:hover{background:var(--z-50)!important;border-color:var(--z-300)!important}
.btn.sm{padding:4px 9px!important;font-size:12.5px!important}
.btn.primary,a.btn.primary{background:var(--m-azul)!important;border-color:var(--m-azul)!important;color:#fff!important}
.btn.primary:hover{background:var(--m-azul-hover)!important;border-color:var(--m-azul-hover)!important}
.btn.black{background:var(--m-preto)!important;border-color:var(--m-preto)!important;color:#fff!important}
.btn.ghost{background:transparent!important;border-color:transparent!important}
.btn.ghost:hover{background:var(--z-100)!important}
.btn.danger{color:var(--danger)!important}
.btn.danger:hover{border-color:#FECDCA!important;background:#FEF3F2!important}
.btn[disabled]{opacity:.45}
.dark .btn{background:#fff!important;color:#000!important;border-color:#fff!important}

/* ---------- superfícies ---------- */
.blk,.acard,.ccard,.sect,.modal,.drawer,.plside,.plcal,.kcol,.pcol,.mcard,.tlist,.cal,.composer,.aprovbox,.meetnext,.dash .blk,.stat,.tile,.lcard,.kcard,.pcard{border:1px solid var(--ui-border)!important}
.blk,.acard,.ccard,.sect,.modal,.drawer,.plside,.plcal,.tlist,.cal{background:var(--ui-panel)!important}
.blk{padding:16px!important}
.acard,.ccard{padding:14px 16px!important}
.acard:hover,.ccard:not(.hero):not(.dark):hover{background:var(--ui-hover)!important}
.dark{background:var(--m-preto)!important;border-color:var(--m-preto)!important}
.ccard.hero{background:var(--m-azul)!important;border-color:var(--m-azul)!important;color:#fff}
.drawer{border-width:0 0 0 1px!important}
.dhead{border-bottom:1px solid var(--ui-border)!important;background:var(--ui-panel)!important}
.mlayer{background:rgba(9,9,11,.32)!important;backdrop-filter:none!important}
.mhead{border-bottom:1px solid var(--ui-border)!important}
.mfoot{border-top:1px solid var(--ui-border)!important;background:var(--ui-surface)!important}
.banner{background:var(--m-amarelo-20)!important;color:#000!important;border:1px solid var(--m-amarelo-t50)!important}
.empty{color:var(--ui-text-2)!important}
.toast{background:var(--m-preto)!important;color:#fff!important;border:1px solid var(--m-preto)}

/* ---------- formulários ---------- */
label.f{font-size:12px!important;font-weight:600!important;color:var(--ui-text-2)!important;gap:5px!important}
label.f input,label.f select,label.f textarea,.inp,.filters input,.filters select,input[type="search"],.pladd,select.inp,textarea.inp{border:1px solid var(--z-200)!important;background:var(--ui-panel)!important;color:var(--ui-text)!important;font-size:13.5px!important;padding:7px 10px!important}
label.f input:hover,.inp:hover,.filters input:hover,.filters select:hover{border-color:var(--z-300)!important}
label.f input:disabled,.inp:disabled{background:var(--z-50)!important;color:var(--ui-text-2)!important}
input[type="checkbox"],input[type="radio"]{accent-color:var(--m-azul)}

/* ---------- tabelas e listas ---------- */
table.atable{border-collapse:collapse!important}
table.atable th{background:var(--ui-surface)!important;border-bottom:1px solid var(--ui-border)!important;padding:8px 12px!important}
table.atable td{border-bottom:1px solid var(--ui-border)!important;padding:9px 12px!important;font-size:13.5px}
table.atable tbody tr:hover td{background:var(--ui-hover)!important}
table.atable tr.ftot td{background:var(--ui-surface)!important}
.trow,.mine-row,.rowc,.li,.dcom,.pli{border-color:var(--ui-border)!important}
.trow:hover,.mine-row:hover,.rowc:hover,.dcom:hover,.pli:hover{background:var(--ui-hover)!important}
.dcom:hover{border-color:var(--ui-border)!important}

/* ---------- segmentados / abas ---------- */
.seg{background:var(--z-100)!important;border:1px solid var(--ui-border)!important;padding:2px!important}
.seg button{border-radius:0!important;padding:5px 12px!important;font-size:13px!important;font-weight:600!important;color:var(--z-600)!important;background:transparent!important}
.seg button.on{background:var(--ui-panel)!important;color:var(--ui-text)!important;outline:1px solid var(--ui-border)}
.seg button .n{background:var(--m-azul-t10)!important;color:var(--m-azul)!important}
.tabs,.dtabs{border-bottom:1px solid var(--ui-border)!important;background:transparent!important}
.tab{border-radius:0!important;background:transparent!important;border-bottom:2px solid transparent!important;color:var(--z-600)!important;font-weight:600!important}
.tab:hover{color:var(--ui-text)!important;background:transparent!important}
.tab.on{color:var(--ui-accent)!important;border-bottom-color:var(--ui-accent)!important;background:transparent!important}
.tab .n{background:var(--m-azul)!important;color:#fff!important}
.fchips button{background:var(--ui-panel)!important;border:1px solid var(--z-200)!important;color:var(--z-600)!important}
.fchips button.on{background:var(--m-azul-t10)!important;border-color:var(--m-azul-t20)!important;color:var(--m-azul)!important}
.fchips button.on b{color:var(--m-azul)!important}

/* ---------- badges / pílulas ---------- */
.pill,.tag{border:1px solid var(--bd,transparent)!important;font-weight:600!important}
.stchip{background:var(--ui-panel)!important;border:1px solid var(--ui-border)!important;color:var(--ui-text)!important}
.fpill,.apb{border:1px solid currentColor}
.fpill{border-color:color-mix(in srgb,currentColor 25%,transparent)!important}
.apb{border-color:color-mix(in srgb,currentColor 25%,transparent)!important}
.apb.pend{background:var(--m-amarelo-t25)!important;color:#000!important;border-color:var(--m-amarelo-t50)!important}
.ftag{background:var(--m-azul-t10)!important;color:var(--m-azul)!important;border:1px solid var(--m-azul-t20)}
.ftag.nd{background:var(--m-ciano-t15)!important;color:#000!important;border-color:var(--m-ciano-t40)}
.chip{border:1px solid var(--ui-border)}
.gchip,.sync{border:1px solid var(--ui-border)!important}

/* ---------- kanban / cartões ---------- */
.pcol,.kcol{background:var(--ui-surface)!important}
.mcard,.pcard,.kcard{background:var(--ui-panel)!important}
.mcard:hover,.pcard:hover,.kcard:hover{border-color:var(--z-300)!important;background:var(--ui-panel)!important}

/* ---------- avatares (imagens: cantos retos) ---------- */
.av{border-radius:0!important}

/* ---------- gráficos e destaques ---------- */
.bars .b{background:var(--z-100)!important}
.bars .b i{background:var(--m-ciano)!important}
.bars .bc.cur .b{background:var(--m-azul-t10)!important}
.bars .bc.cur .b i{background:var(--m-azul)!important}
.chart .tip,.btip{background:var(--m-preto)!important;color:#fff!important}
.meetnext,.meetnext.logo{background:var(--m-azul)!important;border-color:var(--m-azul)!important;color:#fff!important}
.meetnext.agora{background:var(--m-ciano)!important;border-color:var(--m-ciano)!important;color:#000!important}
.meetnext.agora .sub{color:#000!important}
.btn.meetgo{background:#fff!important;color:var(--m-azul)!important;border-color:#fff!important}
.meetnext.agora .btn.meetgo{color:#000!important}
.meetchip{background:var(--m-azul-t05)!important;border:1px solid var(--m-azul-t20)!important;color:var(--m-azul)!important}
.meetchip.agora{background:var(--m-ciano-t15)!important;border-color:var(--m-ciano-t40)!important;color:#000!important}
.meetchip a,.meetchip.agora a{background:var(--m-azul)!important;color:#fff!important}
.mcd.agora{color:#000!important;background:var(--m-ciano-t15);padding:0 4px}
.mcd.logo{color:var(--m-azul)!important}

/* ---------- aprovação / avisos ---------- */
.aprovbox{background:var(--ui-panel)!important}
.aprovbox.pend{background:var(--m-amarelo-20)!important;border-color:var(--m-amarelo-t50)!important}
.aprovbox.ok{background:#F6FEF9!important;border-color:#ABEFC6!important}
.aprovbox.adj{background:#FEF3F2!important;border-color:#FECDCA!important}
.pickrow,.psigner,.eprf,.modt{border:1px solid var(--z-200)!important}
.pickrow.on,.psigner.on{border-color:var(--m-azul)!important;background:var(--m-azul-t05)!important}

/* ---------- editor da proposta ---------- */
.psecbar{background:var(--m-azul)!important;font-family:var(--font-display)!important;letter-spacing:.02em!important}
.psecbar.ghost{background:var(--m-azul-t05)!important;color:var(--m-azul)!important;border:1px dashed var(--m-azul-t20)}
table.pitab tr.grp td{background:var(--m-azul-t05)!important}

/* ---------- planejador ---------- */
.plgrid{border:1px solid var(--ui-border)!important}
.pgh,.pga{border-color:var(--ui-border)!important}
.pdh,.pad,.pday{border-left-color:var(--ui-border)!important}
.phr{border-top-color:var(--z-100)!important}
.pday.fds{background:var(--ui-surface)!important}
.pdh.hoje b{background:var(--m-azul)!important}
.pnow{border-top-color:var(--m-azul)!important}.pnow::before,.pnowl{background:var(--m-azul)!important}
.pev.reu{background:var(--z-100)!important;border:1px solid var(--z-200)!important;border-left:2px solid var(--z-400)!important;color:var(--z-700)!important}
.pev.blk{border:1px solid color-mix(in srgb,var(--c) 25%,transparent)!important;border-left:2px solid var(--c)!important}
.plad{border-color:color-mix(in srgb,var(--c) 40%,transparent)!important;background:color-mix(in srgb,var(--c) 6%,#fff)!important}
.pevlink{background:var(--m-azul)!important}
.plchk{border-style:solid!important;border-color:var(--z-300)!important}
.plchk.on{background:var(--m-azul)!important}

/* ---------- menu suspenso ---------- */
.combo{border:1px solid var(--z-200)!important;padding:2px!important}
.combo .ci:hover,.combo .ci.on{background:var(--m-azul-t05)!important}
.combo mark{background:var(--m-amarelo-t50)!important}

/* ---------- ajustes finos ---------- */
.ccard .ct{font-family:var(--font-display)!important;text-transform:uppercase;font-size:15px!important;font-weight:600!important;letter-spacing:-.005em}
.ccard .cv{font-family:var(--font-display)!important;font-weight:600!important;letter-spacing:-.02em}
.ccard .cico,.acard .cico,.cico{background:var(--z-100)!important;border:1px solid var(--ui-border)!important}
.ccard.hero .cico.w{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.2)!important}
.ccard.hero.alt{background:var(--m-preto)!important;border-color:var(--m-preto)!important}
.ccard .chip{font-family:var(--font-sans)!important;background:#ECFDF3!important;color:#067647!important;border:1px solid #ABEFC6}
.ccard .chip.red{background:#FEF3F2!important;color:var(--danger)!important;border-color:#FECDCA}
.ccard.hero .chip{background:rgba(255,255,255,.16)!important;color:#fff!important;border-color:rgba(255,255,255,.3)}
.ccard .cf:hover{background:var(--ui-hover)!important}
.ccard.hero .cf:hover{background:rgba(255,255,255,.06)!important}
.welcome span{color:var(--m-azul)!important}
.bars .b{background:var(--z-50)!important}
.ttitle{font-family:var(--font-display)!important;text-transform:uppercase;letter-spacing:-.01em!important;font-weight:600!important}
.pcol,.mcol{background:var(--ui-surface)!important;border:1px solid var(--ui-border)!important}
.mst{background:transparent!important;color:var(--ui-text)!important;display:inline-flex!important;align-items:center;gap:7px;padding:2px 0!important;font-size:11px!important;letter-spacing:.12em!important;text-transform:uppercase;font-weight:600!important}
.mst::before{content:'';width:8px;height:8px;background:var(--c,var(--z-400));border-radius:999px!important;flex:none}
.mcnt{font-weight:600!important;color:var(--ui-text-2)!important}
.mcol input[data-madd],.pcol [data-avnew]{color:var(--ui-text-2)!important}
.mcol input[data-madd]::placeholder{color:var(--ui-text-2)}

/* ---------- dashboard (KPIs compactos + 65/35) ---------- */
.tnum{font-variant-numeric:tabular-nums}
.dkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.dkpi{background:var(--ui-panel);border:1px solid var(--ui-border);padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.dkpi:hover{border-color:var(--z-300)!important}
.dkh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:500;color:var(--ui-text-2)}
.dkgo{font-size:12px;color:var(--ui-text-2);opacity:0;transition:opacity .15s}.dkpi:hover .dkgo{opacity:1;color:var(--ui-accent)}
.dkv{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dkv>span:first-child{font:600 24px/1.15 var(--font-display);letter-spacing:-.02em;color:var(--ui-text)}
.dbadge{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px!important;background:var(--z-100);color:var(--z-600);border:1px solid var(--z-200);white-space:nowrap}
.dbadge.azul{background:var(--m-azul-t10);color:var(--m-azul);border-color:var(--m-azul-t20)}
.dbadge.ciano{background:var(--m-ciano-t15);color:#000;border-color:var(--m-ciano-t40)}
.dbadge.red{background:#FEF3F2;color:var(--danger);border-color:#FECDCA}
.dbadge.ok{background:#ECFDF3;color:var(--ok);border-color:#ABEFC6}
.dksub{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:auto;padding-top:8px;border-top:1px solid var(--ui-border)}
.dksub div{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--ui-text-2);white-space:nowrap}
.dksub b{font-size:13px;font-weight:600;color:var(--ui-text)}
.dksub .red b{color:var(--danger)}.dksub .warn b{color:#000;background:var(--m-amarelo-t25);padding:0 4px}
.dmain{display:grid;grid-template-columns:minmax(0,65fr) minmax(0,35fr);gap:12px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.dcol>.blk{margin:0}
.dcard{background:var(--ui-panel);border:1px solid var(--ui-border);padding:14px 16px;min-width:0;transition:border-color .15s}
.dcard:hover{border-color:var(--z-300)}
.dch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.dct{font:600 13px/1.3 var(--font-display);text-transform:uppercase;letter-spacing:.01em;color:var(--ui-text)}
.dcs{font-size:12px;color:var(--ui-text-2);margin-top:2px}
.dlink{border:0;background:none;padding:0;font:500 12.5px var(--font-sans);color:var(--ui-text-2);cursor:pointer;white-space:nowrap}
.dlink:hover{color:var(--ui-accent)}
.dfilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.dfil{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--z-200);background:var(--ui-panel);padding:4px 10px;font-size:12.5px;font-weight:500;color:var(--z-600);cursor:pointer}
.dfil b{font-weight:600;color:var(--ui-text)}
.dfil:hover{border-color:var(--z-300)}
.dfil.on{border-color:var(--m-azul);color:var(--m-azul);background:var(--m-azul-t05)}.dfil.on b{color:var(--m-azul)}
.dfil.red b{color:var(--danger)}
.dlist{border-top:1px solid var(--ui-border);margin:0 -16px -14px}
.drow{display:grid;grid-template-columns:76px minmax(0,1fr) auto 76px 30px;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--ui-border);cursor:pointer;transition:background-color .15s}
.drow:last-child{border-bottom:0}
.drow:hover{background:var(--z-50)}
.drow.sm{grid-template-columns:auto minmax(0,1fr) auto;padding:7px 0;margin:0;border-bottom:1px solid var(--ui-border)}
.drow.sm:hover{background:transparent}.drow.sm:hover b{color:var(--ui-accent)}
.dcode{font:500 12px var(--font-sans);color:var(--ui-text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dtt{min-width:0;display:flex;flex-direction:column}
.dtt b{font-size:13.5px;font-weight:600;color:var(--ui-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtt span{font-size:12px;color:var(--ui-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddue{text-align:right;font-size:12.5px}
.dplay{width:28px;height:28px;border:1px solid var(--z-200);background:var(--ui-panel);color:var(--ui-text-2);cursor:pointer;display:grid;place-items:center;font-size:10px;padding:0}
.dplay:hover{border-color:var(--m-azul);color:var(--m-azul)}
.dplay.on{border-color:var(--m-azul);background:var(--m-azul);color:#fff}.dplay.on .ic{display:none}
.dcount{font-size:12px;font-weight:600;color:var(--ui-text-2)}
.dempty{padding:18px 16px;font-size:13px;color:var(--ui-text-2)}
.dmore{width:100%;border:0;border-top:1px solid var(--ui-border);background:none;padding:9px;font-size:12.5px;color:var(--ui-text-2);cursor:pointer}.dmore:hover{color:var(--ui-accent);background:var(--z-50)}
.dtimer .dclockrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dclock{font:500 30px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ui-text)}
.dclock.dim{color:var(--z-300)}
.dtbtns{display:flex;gap:6px}
.dtinfo{margin-top:8px;font-size:12.5px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtinfo .dlink{color:var(--ui-text);font-weight:600}
.dfoot{display:flex;justify-content:space-between;margin:12px -16px -14px;padding:9px 16px;border-top:1px solid var(--ui-border);font-size:12.5px;color:var(--ui-text-2)}
.dfoot b{color:var(--ui-text);font-weight:600}
.dchart .bars{margin-top:4px}
.dbottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px;align-items:start}
.dcard .cal{border:0!important;padding:0!important;background:transparent!important}
.dcol .blk{padding:14px 16px!important}
@media (max-width:1200px){.dkpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dbottom{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){.dmain{grid-template-columns:1fr}}
.sidebox{padding:8px!important;background:transparent!important;border:0!important}
.sidebox #btnSair{width:100%;justify-content:center;color:var(--ui-text-2)!important}

/* ---------- cantos levemente arredondados (referência da tela inicial) ---------- */
.blk,.acard,.ccard,.sect,.modal,.plside,.plcal,.kcol,.pcol,.mcol,.mcard,.pcard,.kcard,.tlist,.cal,.aprovbox,.meetnext,.dkpi,.dcard,.tile,.banner,.combo,.plgrid,.pickrow,.psigner,.eprf,.modt,.composer,.chart .tip,.btip,.toast,.dhead~.dbody .sect{border-radius:var(--radius-lg)!important}
.btn,.nav,.iconbtn,.gsearch,.chip-me,.seg,.fchips button,.dfil,.dplay,.pladd,.inp,label.f input,label.f select,label.f textarea,.filters input,.filters select,input[type="search"],input[type="text"],input[type="date"],input[type="time"],input[type="number"],input[type="email"],select,textarea,.av,.cico,.combo .ci,.meetchip,.pev,.plad,.psecbar,.tab,.whopick button,.plchk,.mcard .av,.sidebox{border-radius:var(--radius)!important}
.seg button{border-radius:4px!important}
.drawer{border-radius:var(--radius-lg) 0 0 var(--radius-lg)!important}
input[type="checkbox"]{border-radius:3px!important}
/* item ativo do menu: fundo claro + barra azul (como na referência) */
.nav.on{background:var(--m-azul-t05)!important;border-radius:0 var(--radius) var(--radius) 0!important}

/* ===== Início (referência) ===== */
.welcome{font-family:'Kanit',sans-serif;text-transform:uppercase;letter-spacing:.01em}
.welcome span{color:var(--ui-muted,#71717A)}
.dkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.dkpi{background:var(--ui-surface,#fff);border:1px solid var(--line);border-radius:var(--radius-lg)!important;padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0}
.dkpi:hover{border-color:var(--m-azul-t40,#9999FF)}
.dkh{display:flex;gap:10px;align-items:center}
.dki{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--radius)!important;color:var(--ink)}
.dki svg{width:16px;height:16px}
.dkt{font-weight:600;font-size:13.5px;color:var(--ink)}
.dks{font-size:12px;color:var(--muted)}
.dkv{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dkv>.tnum{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.dkl{font-size:13px;color:var(--ink)}
.dkf{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.dkf b{color:var(--ink);font-weight:600}.dkf b.red,.dkf b.warn{color:#D92D20}
.dbadge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px!important;background:var(--m-azul-t05,#F0F0FF);color:var(--m-azul,#0000FF);border:1px solid var(--m-azul-t20,#CCCCFF)}
.dbadge.ok{background:#ECFDF3;color:#067647;border-color:#ABEFC6}
.dbadge.red{background:#FEF3F2;color:#B42318;border-color:#FECDCA}
.drow3{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:stretch}
.dcard{background:var(--ui-surface,#fff);border:1px solid var(--line);border-radius:var(--radius-lg)!important;padding:16px 18px;min-width:0}
.dch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.dct{font-weight:600;font-size:14px;color:var(--ink);font-family:inherit;text-transform:none}
.dcs{font-size:12px;color:var(--muted);margin-top:2px}
.dfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dfil{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--line);background:var(--ui-surface,#fff);border-radius:var(--radius)!important;font-size:12.5px;color:var(--ink);cursor:pointer}
.dfil i{width:7px;height:7px;border-radius:50%!important;display:inline-block}
.dfil.on{border-color:var(--m-azul);background:var(--m-azul-t05,#F0F0FF)}
.dn{font-size:11px;font-weight:600;min-width:20px;height:18px;padding:0 5px;display:inline-grid;place-items:center;border-radius:999px!important;background:#F4F4F5;color:var(--ink)}
.dn.red{background:#FEF3F2;color:#B42318}.dn.amarelo{background:#FEF7E0;color:#000}.dn.azul{background:var(--m-azul-t05,#F0F0FF);color:var(--m-azul)}
.dlist{display:flex;flex-direction:column}
.dsem .drow{display:grid;grid-template-columns:18px minmax(0,1fr) auto 28px 64px;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}
.dsem .drow:first-child{border-top:0}
.dsem .drow:hover{background:var(--m-azul-t05,#F7F7FF)}
.dtt{min-width:0}.dtt b{font-weight:500;font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchk{width:16px;height:16px;border:1.5px solid #A1A1AA;border-radius:4px!important;display:inline-block;cursor:pointer;background:#fff}
.dchk:hover{border-color:var(--m-azul)}.dchk.none{visibility:hidden}
.dplay{width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;border-radius:50%!important;font-size:9px;color:var(--ink);cursor:pointer;padding:0}
.dplay:hover{border-color:var(--m-azul);color:var(--m-azul)}
.dplay.on{background:var(--m-azul);border-color:var(--m-azul);color:#fff}
.dtime{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.dempty{padding:18px 4px;color:var(--muted);font-size:13px}
.dmore{border:0;background:none;color:var(--m-azul);font-size:12.5px;padding:8px 2px;text-align:left;cursor:pointer}
.dtimer{border:1.5px solid var(--m-azul)!important;background:var(--m-azul-t05,#F7F7FF)!important;display:flex;flex-direction:column}
.dtimer .dclock{font-size:34px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.dtimer .dclock.dim{color:#A1A1AA}
.dtgo{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dtbtns{display:flex;gap:6px}
.dlink{border:0;background:none;padding:0;color:var(--m-azul);font-size:13px;cursor:pointer;text-align:left}
.dlink.strong{font-weight:600}
.dthint{font-size:12px;color:var(--muted);margin-top:auto;padding-top:14px}
.dent .seg.sm button{height:26px;padding:0 10px;font-size:12px}
.dbig{font-size:13px;color:var(--muted);margin-bottom:8px}.dbig .tnum{font-size:24px;font-weight:600;color:var(--ink);margin-right:4px}
.dchart{min-height:150px}
@media (max-width:1280px){.drow3{grid-template-columns:1fr 1fr}.drow3 .dsem{grid-column:1/-1}}
@media (max-width:1100px){.dkpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.dkpis,.drow3{grid-template-columns:1fr}}
:root.dark .dkpi,:root.dark .dcard,:root.dark .dplay,:root.dark .dfil,:root.dark .dchk{background:var(--ui-surface)}
:root.dark .dtimer{background:rgba(0,0,255,.12)!important}
.dkpi .dkh{justify-content:flex-start!important;text-align:left}
.dkpi .dkh>div{flex:1;min-width:0}
.dsem .drow{padding:9px 6px!important;margin:0!important;border-bottom:0!important}
.dent .seg{display:inline-flex!important;flex-direction:row!important;flex:none;white-space:nowrap}
.dent .dch .dct{white-space:nowrap}
.drow3{align-items:start}
.dtimer{min-height:240px}
.dsem .dlist{margin:0!important;padding:0!important}
.dent .seg button{padding:4px 9px!important;font-size:12px!important}
/* respostas de comentários */
.cresp{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.crr{display:flex;gap:8px;padding-left:10px;border-left:2px solid var(--line)}
.crb{flex:1;min-width:0}.crb .hd{display:flex;gap:8px;align-items:center;font-size:12.5px}.crb .tx{font-size:13px;margin-top:2px;white-space:pre-wrap}
.crbtn{align-self:flex-start;border:0;background:none;padding:2px 0;color:var(--m-azul);font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.crbtn:hover{text-decoration:underline}.crbtn svg{width:13px;height:13px}
.crform{display:flex;flex-direction:column;gap:6px}
.crform textarea{width:100%;min-height:56px;resize:vertical;padding:8px 10px;border:1px solid var(--m-azul);font:inherit;font-size:13px}
.crform .row{display:flex;gap:6px;align-items:center}

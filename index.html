  if((el = tg.closest('[data-mf]'))){ ui.mineFilter = el.dataset.mf; render(); return; }
  if((el = tg.closest('[data-chk-task]'))){ const [pid, tid] = el.dataset.chkTask.split('|'); const p = procById(pid), t = taskOf(p, tid); setTaskStatus(p, t, t.status === 'concluida' ? 'andamento' : 'concluida'); save(); render(); return; }
  if((el = tg.closest('[data-chk-sub]'))){ const [pid, tid, sid] = el.dataset.chkSub.split('|'); const t = taskOf(procById(pid), tid), s = t.subs.find(x => x.id === sid); s.feito = !s.feito; logT(t, `${s.feito ? 'concluiu' : 'reabriu'} a subtarefa “${s.titulo}”`); save(); render(); return; }
  if((el = tg.closest('[data-chk-com]'))){ const [pid, tid, cid] = el.dataset.chkCom.split('|'); const t = taskOf(procById(pid), tid), c = t.coms.find(x => x.id === cid); c.resolvido = !c.resolvido; save(); render(); return; }
  if((el = tg.closest('[data-open]'))){ const [pid, tid] = el.dataset.open.split('|'); openTask(pid, tid); return; }
  if((el = tg.closest('#view [data-proc]'))){ openDrawer('proc', el.dataset.proc); return; }
  if((el = tg.closest('#view [data-prop]'))){ openDrawer('prop', el.dataset.prop); return; }
});
let savedRange = null;
function insertLink(){
  let u = $('#edLink').value.trim(); if(!u) return;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  const ed = $('#drawer .edarea'); ed.focus();
  const sel = getSelection(); sel.removeAllRanges();
  if(savedRange && ed.contains(savedRange.commonAncestorContainer)) sel.addRange(savedRange);
  if(sel.isCollapsed || !sel.rangeCount){ document.execCommand('insertHTML', false, `<a href="${esc(u)}">${esc(u)}</a>&nbsp;`); }
  else document.execCommand('createLink', false, u);
  $('#drawer .linkrow').hidden = true;
}
document.addEventListener('mousedown', e => { if(e.target.closest('.edbar button')) e.preventDefault(); });
function addTask(){
  const inp = $('#newTask'), v = inp.value.trim(); if(!v) return;
  const p = procById(ui.drawer.id);
  p.tarefas.push(mkTask(v, [], {resp:[me]})); logP(p, `criou a tarefa “${v}”`);
  save(); render(); setTimeout(() => $('#newTask')?.focus(), 0);
}

document.addEventListener('change', e => {
  const tg = e.target;
  if(matHandleChange(tg)) return;
  if(tg.id === 'mResp'){ ui.mResp = tg.value; render(); return; }
  if(tg.id === 'mTipo'){ ui.mTipo = tg.value; render(); return; }
  if(tg.id === 'mfFile' && tg.files[0]){ resizePhoto(tg.files[0], url => { memberDraft.foto = url; $('#mfPh').innerHTML = photoBox(memberDraft, 'ph'); $('#mfNoPhoto').hidden = false; }); return; }
  if(tg.dataset.ustatus){ U[tg.dataset.ustatus].status = tg.value; save(); render(); showPop(tg.dataset.ustatus, document.querySelector(`[data-user="${tg.dataset.ustatus}"]`) || tg); toast(`${first(tg.dataset.ustatus)}: ${STATUS_U[tg.value]}`); return; }
  if(tg.dataset.gsync){ U[me].gcal.sync = U[me].gcal.sync || {}; U[me].gcal.sync[tg.dataset.gsync] = tg.checked; save(); render(); return; }
  if(tg.id === 'cfgAprov'){ S.cfg.aprovadorMaterial = tg.value; save(); toast('Aprovador atualizado'); return; }
  if(tg.id === 'cfgAvisos'){ S.cfg.emailsAviso = tg.value.trim(); save(); return; }
  if(tg.id === 'lCid'){ ui.lCid = tg.value; ui.lBai = ''; render(); return; }
  if(tg.id === 'lBai'){ ui.lBai = tg.value; render(); return; }
  if(tg.id === 'lSt'){ ui.lSt = tg.value; render(); return; }
  if(tg.id === 'pResp'){ ui.fResp = tg.value; render(); return; }
  if(tg.id === 'pServ'){ ui.fServ = tg.value; render(); return; }
  if(tg.id === 'pMine'){ ui.fMine = tg.checked; render(); return; }
  if(tg.dataset.imv){ const p = procById(ui.drawer.id); (p.imovel = p.imovel || {})[tg.dataset.imv] = tg.value; logP(p, 'atualizou os dados do imóvel'); save(); return; }
  if(tg.dataset.lkf){ const p = procById(ui.drawer.id), l = p.links.find(x => x.id === tg.closest('[data-lk]').dataset.lk); l[tg.dataset.lkf] = tg.value.trim(); save(); render(); return; }
  if(tg.dataset.pf){
    const p = procById(ui.drawer.id), k = tg.dataset.pf, v = tg.value;
    if(p[k] === v) return;
    if(k === 'status') logP(p, `mudou o status do processo para “${PS[v].l}”`);
    else if(k === 'resp'){ logP(p, `passou a responsabilidade do processo para ${first(v)}`); notify(v, `passou o processo ${esc(p.codigo)} para você`, p.id, null); }
    else if(k === 'protocolo') logP(p, `registrou o protocolo “${v}”`);
    else if(k === 'prazo') logP(p, `mudou o prazo final para ${fmtD(v)}`);
    else logP(p, `alterou ${k}`);
    const old = p[k]; p[k] = v; save(); render(); if(k === 'status') afterStatus(p, old); return;
  }
  if(ui.task && tg.closest('#layer')){
    const [p, t] = curTask();
    if(tg.dataset.tf){
      const k = tg.dataset.tf, v = tg.value;
      if(k === 'status'){ setTaskStatus(p, t, v); save(); renderTask(); render(); return; }
      if(k === 'prazo') logT(t, v ? `definiu o prazo para ${fmtD(v)}` : 'removeu o prazo');
      if(k === 'prio') logT(t, `mudou a prioridade para ${PRIO[v].l}`);
      if(k === 'titulo') logT(t, `renomeou a tarefa para “${v}”`);
      t[k] = v; save(); render();
      if(k === 'prazo' || k === 'prio') renderTask();
      return;
    }
    if(tg.dataset.sf){
      const s = t.subs.find(x => x.id === tg.closest('[data-sub]').dataset.sub), k = tg.dataset.sf, v = tg.value;
      s[k] = v;
      if(k === 'resp' && v){ logT(t, `atribuiu a subtarefa “${s.titulo}” a ${first(v)}`); notify(v, `atribuiu a subtarefa “${esc(s.titulo)}” a você`, p.id, t.id); }
      if(k === 'prazo') logT(t, `definiu o prazo de “${s.titulo}” para ${fmtD(v)}`);
      save(); render(); if(k !== 'titulo') renderTask(); return;
    }
  }
});
document.addEventListener('input', e => {
  const tg = e.target;
  if(tg.id === 'mq'){ ui.mq = tg.value; const pos = tg.selectionStart; render(); const n = $('#mq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if(tg.id === 'lq'){ ui.lq = tg.value; const pos = tg.selectionStart; render(); const n = $('#lq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if(tg.id === 'aq'){ ui.aq = tg.value; const pos = tg.selectionStart; render(); const n = $('#aq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if(['lfVal', 'lfEm', 'lfAnt', 'lfPrep'].includes(tg.id)){ licPreview(); return; }
  if(tg.id === 'gq'){ ui.q = tg.value; ui.sel = {g:'', e:''}; if(ui.view !== 'proc'){ ui.view = 'proc'; } render(); const n = $('#gq'); n.focus(); return; }
  if(tg.id === 'tq'){ ui.tq = tg.value; const pos = tg.selectionStart; render(); const n = $('#tq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if(tg.id === 'pq'){ ui.q = tg.value; const pos = tg.selectionStart; render(); const n = $('#pq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if(tg.matches('.composer textarea')) mentionMenu(tg);
});
document.addEventListener('keydown', e => {
  const tg = e.target;
  if(e.key === '/' && !tg.closest('input,textarea,select,[contenteditable]')){ e.preventDefault(); $('#gq').focus(); return; }
  if(matHandleKey(e, tg)) return;
  if(e.key === 'Escape'){ if(!$('#pop').hidden){ $('#pop').hidden = true; return; } if($('#layer').innerHTML){ memberDraft = null; closeTask(); return; } if(ui.drawer){ closeDrawer(); return; } }
  if(tg.id === 'newTask' && e.key === 'Enter'){ addTask(); return; }
  if(tg.id === 'edLink' && e.key === 'Enter'){ e.preventDefault(); insertLink(); return; }
  if(tg.id === 'driveUrl' && e.key === 'Enter'){ $('[data-drivesave]').click(); return; }
  if(tg.id === 'newSub' && e.key === 'Enter'){ const v = tg.value.trim(); if(!v) return; const [p, t] = curTask();
    t.subs.push({id:uid(), titulo:v, feito:false, resp:'', prazo:''}); logT(t, `criou a subtarefa “${v}”`); save(); renderTask(); render(); setTimeout(() => $('#newSub')?.focus(), 0); return; }
  if(tg.matches('.composer textarea')){
    const menu = $('.mentions', tg.closest('.composer'));
    if(!menu.hidden && (e.key === 'Enter' || e.key === 'Tab')){ e.preventDefault(); const it = $('div.on', menu) || $('div', menu); if(it) pickMention(it); return; }
    if(!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){ e.preventDefault(); const its = $$('div', menu); let i = its.findIndex(x => x.classList.contains('on')); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + its.length) % its.length; its.forEach((x, j) => x.classList.toggle('on', j === i)); return; }
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sendComment(tg.closest('.composer')); }
  }
  if(tg.matches('input.st, .ttitle') && e.key === 'Enter') tg.blur();
});
function mentionMenu(ta){
  const menu = $('.mentions', ta.closest('.composer'));
  const m = ta.value.slice(0, ta.selectionStart).match(/@([A-Za-zÀ-ú]*)$/);
  if(!m){ menu.hidden = true; return; }
  const q = norm(m[1]);
  const us = USERS.filter(u => norm(u.nome).startsWith(q) || norm(first(u.id)).startsWith(q));
  if(!us.length){ menu.hidden = true; return; }
  menu.innerHTML = us.map((u, i) => `<div data-u="${u.id}" class="${i === 0 ? 'on' : ''}">${av(u.id, true, true)}${esc(u.nome)}</div>`).join('');
  menu.hidden = false;
}
function pickMention(el){
  const box = el.closest('.composer'), ta = $('textarea', box), pos = ta.selectionStart;
  const before = ta.value.slice(0, pos).replace(/@([A-Za-zÀ-ú]*)$/, '@' + first(el.dataset.u) + ' ');
  ta.value = before + ta.value.slice(pos); ta.focus(); ta.setSelectionRange(before.length, before.length);
  $('.mentions', box).hidden = true;
}
// arrastar no quadro
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.kcard,.pk'); if(c){ e.dataTransfer.setData('text/plain', c.dataset.proc); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const col = e.target.closest?.('.col,.pcol'); if(col){ e.preventDefault(); $$('.col,.pcol').forEach(x => x.classList.toggle('over', x === col)); } });
document.addEventListener('dragleave', e => { if(!e.relatedTarget?.closest?.('.col,.pcol,.mcol')) $$('.col,.pcol,.mcol').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.mcard:not(.pk)'); if(c){ e.dataTransfer.setData('text/plain', 'mat:' + c.dataset.mat); } });
document.addEventListener('dragover', e => { const col = e.target.closest?.('.mcol'); if(col){ e.preventDefault(); $$('.mcol').forEach(x => x.classList.toggle('over', x === col)); } });
document.addEventListener('drop', e => { const col = e.target.closest?.('.mcol'); if(!col) return; e.preventDefault(); $$('.mcol').forEach(x => x.classList.remove('over'));
  const d = e.dataTransfer.getData('text/plain'); if(!d.startsWith('mat:')) return; const m = matById(d.slice(4)); if(m && m.status !== col.dataset.mcol){ setMatStatus(m, col.dataset.mcol); save(); render(); toast(`${m.codigo} → ${MS[m.status].l}`); } });
document.addEventListener('drop', e => { const col = e.target.closest?.('.col,.pcol'); if(!col) return; e.preventDefault();
  const p = procById(e.dataTransfer.getData('text/plain')); $$('.col,.pcol').forEach(x => x.classList.remove('over'));
  if(p && p.status !== col.dataset.col){ const old = p.status; logP(p, `mudou o status do processo para “${PS[col.dataset.col].l}”`); p.status = col.dataset.col; save(); render(); toast(`${p.codigo} → ${PS[p.status].l}`); afterStatus(p, old); } });

boot();
</script>

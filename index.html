function collect(){
  const out = {};
  Object.entries(TIPO_COL).forEach(([tipo, col]) => (S[col] || []).forEach(o => { out[tipo + ':' + o.id] = {tipo, dados:o}; }));
  out['config:geral'] = {tipo:'config', dados:S.cfg};
  out['config:servicos'] = {tipo:'config', dados:{lista:S.servs}};
  out['config:clientes'] = {tipo:'config', dados:{lista:S.clis}};
  out['config:assinaturas'] = {tipo:'config', dados:S.assin};
  return out;
}
const CFG_DOCS = ['config:geral', 'config:servicos', 'config:clientes', 'config:assinaturas'];
const managedKey = k => CFG_DOCS.includes(k) || Object.keys(TIPO_COL).some(t => k.startsWith(t + ':'));
function applyDoc(k, tipo, dados){
  if(tipo === 'config'){ if(k === 'config:geral') S.cfg = dados; else if(k === 'config:servicos') S.servs = (dados && dados.lista) || []; else if(k === 'config:clientes') S.clis = (dados && dados.lista) || []; else if(k === 'config:assinaturas') S.assin = dados || {}; else S.extra[k] = dados; return; }
  const col = TIPO_COL[tipo]; if(!col) return;
  const id = k.slice(tipo.length + 1); dados.id = id;
  const arr = S[col], i = arr.findIndex(o => o.id === id);
  if(i >= 0) arr[i] = dados; else arr.push(dados);
}
function removeDoc(k){
  const tipo = k.split(':')[0], col = TIPO_COL[tipo]; if(!col) return;
  const id = k.slice(tipo.length + 1); S[col] = S[col].filter(o => o.id !== id);
}
const J = o => JSON.stringify(o);
function merge3(b, m, t){
  if(J(m) === J(b)) return t;
  if(J(t) === J(b)) return m;
  if(Array.isArray(m) && Array.isArray(t)){
    const idd = a => a.every(x => x && typeof x === 'object' && 'id' in x);
    if(idd(m) && idd(t)){
      const B = Array.isArray(b) ? b : [], bm = new Map(B.map(x => [x.id, x])), mm = new Map(m.map(x => [x.id, x])), tm = new Map(t.map(x => [x.id, x]));
      const out = [];
      [...new Set([...t.map(x => x.id), ...m.map(x => x.id)])].forEach(id => { const bx = bm.get(id), mx = mm.get(id), tx = tm.get(id);
        if(mx && tx) out.push(merge3(bx || {}, mx, tx));
        else if(mx){ if(!bx || J(mx) !== J(bx)) out.push(mx); }
        else if(tx){ if(!bx || J(tx) !== J(bx)) out.push(tx); } });
      return out;
    }
    return m;
  }
  if(m && t && typeof m === 'object' && typeof t === 'object'){
    const B = (b && typeof b === 'object' && !Array.isArray(b)) ? b : {}, o = {};
    new Set([...Object.keys(t), ...Object.keys(m)]).forEach(k => {
      if(!(k in m) && (k in B)){ if(J(t[k]) !== J(B[k])) o[k] = t[k]; return; }
      if(!(k in t) && (k in B)){ if(J(m[k]) !== J(B[k])) o[k] = m[k]; return; }
      o[k] = (k in m) && (k in t) ? merge3(B[k], m[k], t[k]) : (k in m ? m[k] : t[k]); });
    return o;
  }
  return m;
}
function setSync(st){ const el = $('#sync'); if(!el) return; el.className = 'sync ' + st; el.title = {ok:'Tudo salvo', salvando:'Salvando…', erro:'Sem conexão: as mudanças serão enviadas quando voltar'}[st]; el.textContent = {ok:'Salvo', salvando:'Salvando…', erro:'Sem conexão'}[st]; }
function save(){ if(!DB.ready) return; setSync('salvando'); clearTimeout(DB.timer); DB.timer = setTimeout(flush, 350); }
async function flush(){
  if(DB.busy){ DB.again = true; return; }
  DB.busy = true;
  try {
    const cur = collect();
    for(const k in cur){
      const js = J(cur[k].dados), b = DB.base[k];
      if(!b){
        const {data, error} = await sb.from('pm_docs').insert({id:k, tipo:cur[k].tipo, dados:cur[k].dados}).select('versao').single();
        if(error){ if(error.code === '23505') await resolveConflict(k, cur[k]); else throw error; }
        else DB.base[k] = {json:js, versao:data.versao};
      } else if(b.json !== js){
        const {data, error} = await sb.from('pm_docs').update({dados:cur[k].dados}).eq('id', k).eq('versao', b.versao).select('versao');
        if(error) throw error;
        if(!data.length) await resolveConflict(k, cur[k]); else DB.base[k] = {json:js, versao:data[0].versao};
      }
    }
    for(const k of Object.keys(DB.base)){
      if(!cur[k] && managedKey(k)){ const {error} = await sb.from('pm_docs').delete().eq('id', k); if(error) throw error; delete DB.base[k]; }
    }
    setSync('ok');
  } catch(err){ console.error(err); setSync('erro'); clearTimeout(DB.retry); DB.retry = setTimeout(save, 6000); }
  DB.busy = false;
  if(DB.again){ DB.again = false; flush(); }
}
async function resolveConflict(k, mine){
  for(let i = 0; i < 5; i++){
    const {data:row, error} = await sb.from('pm_docs').select('*').eq('id', k).maybeSingle();
    if(error) throw error;
    if(!row){
      const r = await sb.from('pm_docs').insert({id:k, tipo:mine.tipo, dados:mine.dados}).select('versao').single();
      if(!r.error){ DB.base[k] = {json:J(mine.dados), versao:r.data.versao}; return; }
      continue;
    }
    const baseObj = DB.base[k] ? JSON.parse(DB.base[k].json) : {};
    const merged = merge3(baseObj, collect()[k]?.dados ?? mine.dados, row.dados);
    applyDoc(k, mine.tipo, merged);
    const {data} = await sb.from('pm_docs').update({dados:merged}).eq('id', k).eq('versao', row.versao).select('versao');
    if(data && data.length){ DB.base[k] = {json:J(merged), versao:data[0].versao}; afterRemote(k); return; }
  }
  throw new Error('Conflito ao salvar ' + k);
}
function typing(){ const a = document.activeElement; return !!(a && a.matches && a.matches('input:not([type=checkbox]):not([type=file]),textarea,select,[contenteditable]') && !a.closest('.top')); }

  render();
  if(ui.task && k === 'processo:' + ui.task.procId) renderTask();
  if(ui.mat && k === 'material:' + ui.mat) renderMat();
}
document.addEventListener('focusout', () => setTimeout(() => { if(DB.pendingRender && !typing()){ DB.pendingRender = false; render(); if(ui.task) renderTask(); if(ui.mat) renderMat(); } }, 250));
function onRemote(pl){
  if(pl.eventType === 'DELETE'){ const k = pl.old && pl.old.id; if(!k || !DB.base[k]) return; removeDoc(k); delete DB.base[k]; afterRemote(k); return; }
  const row = pl.new, k = row.id, b = DB.base[k];
  if(b && b.versao >= row.versao) return;
  if(row.tipo === 'config' && !CFG_DOCS.includes(k)){ S.extra[k] = row.dados; DB.base[k] = {json:J(row.dados), versao:row.versao}; afterRemote(k); return; }
  const cur = collect()[k];
  let dados = row.dados, pend = false;
  if(b && cur && J(cur.dados) !== b.json){ dados = merge3(JSON.parse(b.json), cur.dados, row.dados); pend = true; }
  applyDoc(k, row.tipo, dados);
  DB.base[k] = {json:J(row.dados), versao:row.versao};
  if(pend) save();
  afterRemote(k);
}

const PP_ST = {nova:'escopo', escopo:'escopo', elaboracao:'elaboracao', revisao:'elaboracao', liberada:'elaboracao', enviada:'enviada', negociacao:'negociacao', aprovada:'aprovada'};
function apiCfgProp(){ try { const own = JSON.parse(localStorage.getItem('pm_api_prop') || 'null'); if(own && own.api) return own; const pp = JSON.parse(localStorage.getItem('pp_settings') || 'null'); return pp && pp.api ? {api:pp.api, token:pp.token} : null; } catch(e){ return null; } }
function apiCfgLic(){ try { const own = JSON.parse(localStorage.getItem('pm_api_lic') || 'null'); if(own && own.url) return own; const a = JSON.parse(localStorage.getItem('mannare_licencas_acesso') || 'null'); return a && a.url ? a : null; } catch(e){ return null; } }
function userByName(n){ const x = norm(n || ''); if(!x) return me; const u = USERS.find(u => norm(u.nome) === x) || USERS.find(u => norm(u.nome).split(' ')[0] === x.split(' ')[0]); return u ? u.id : me; }
function guessModelo(t){ const x = norm(t); return /habite/.test(x) ? 'habitese' : /ambient|licenc|lp\b|li\b|lo\b/.test(x) ? 'licenca' : /loteament|registro|cartori/.test(x) ? 'registro' : /alvar/.test(x) ? 'alvara' : 'material'; }
function mapProp(it){
  const emp = it.empreendimento || it.obra || it.objeto || it.cliente || '—';
  return {id:'pp-' + it.id, ppId:it.id, codigo:it.codigo || '', cliente:it.cliente || '', grupo:it.cliente || '', emp, objeto:it.objeto || '', valor:Number(it.valor) || 0,
    status:PP_ST[it.status] || 'elaboracao', resp:userByName(it.responsavel), modelo:guessModelo(it.objeto || ''), itens:(it.itens || []).filter(x => x && (x.descricao || x.nome)).map(x => [x.descricao || x.nome, Number(x.valor || x.total) || 0]).slice(0, 12)};
}
async function loadApiProps(){
  const c = apiCfgProp(); if(!c){ S.propApi = 'sem'; rebuildProps(); return; }
  try {
    const r = await fetch(c.api, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:J({action:'list', token:c.token})});
    const j = JSON.parse(await r.text()); if(!j.ok) throw new Error(j.error || 'erro');
    apiProps = (j.items || []).filter(it => PP_ST[it.status]).map(mapProp); S.propApi = 'ok';
  } catch(e){ S.propApi = 'erro: ' + e.message; }
  rebuildProps();
}
function rebuildProps(){
  const seen = new Set(), out = [];
  apiProps.forEach(p => { seen.add(p.id); const proc = S.procs.find(x => x.propId === p.id && !x.renovacao); p.procId = proc ? proc.id : null; out.push(p); });
  S.procs.forEach(p => { if(p.prop && !seen.has(p.prop.id)){ seen.add(p.prop.id); out.push({...p.prop, procId:p.id, snapshot:true}); } });
  S.props = out;
}

}

async function boot(){
  if(!sb){ gate(`<h2>Falta configurar a conexão</h2><p>O arquivo <b>config.js</b> desta pasta ainda não tem a chave do Supabase. Veja o passo 3 do guia.</p>`); return; }
  gate('<p class="sub">Carregando…</p>');
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ gate(`<h2>CRM Mannare</h2><p>Propostas, processos, material técnico e licenças.</p><button class="btn primary" id="btnLogin" style="width:100%;justify-content:center;padding:12px">Entrar com Google</button><p class="sub" style="margin-top:14px">Use sua conta @mannare.com.br.</p>`); return; }
  const email = session.user.email.toLowerCase();
  const {data:eq, error:e1} = await sb.from('pm_equipe').select('*');
  const meRow = (eq || []).find(r => r.email.toLowerCase() === email);
  if(e1 || !meRow){ gate(`<h2>Acesso não liberado</h2><p>O e-mail <b>${esc(email)}</b> ainda não está na equipe do painel. Peça a um sócio para incluir você na tela Equipe.</p><button class="btn" id="btnSair">Sair e entrar com outra conta</button>`); return; }
  MYROLE = meRow.papel; S.equipe = eq; me = email;
  let from = 0;
  for(;;){ const {data:rows, error} = await sb.from('pm_docs').select('*').range(from, from + 999); if(error){ gate(`<h2>Erro ao carregar</h2><p>${esc(error.message)}</p>`); return; }
    rows.forEach(r => { applyDoc(r.id, r.tipo, r.dados); DB.base[r.id] = {json:J(r.dados), versao:r.versao}; }); if(rows.length < 1000) break; from += 1000; }
  eq.forEach(r => { const id = r.email.toLowerCase(); if(!S.users.find(u => u.id === id)) S.users.push(newMember(r)); });
  S.users.forEach(u => { u.gcal = u.gcal || {on:false, sync:{prazos:true, licencas:true, tram:false, trazer:false}}; if(!eq.find(r => r.email.toLowerCase() === u.id)) u.inativo = true; else delete u.inativo; });
  const lim = Date.now() - 60 * 864e5; S.notifs = S.notifs.filter(n => !(n.para === me && n.lida && new Date(n.em) < lim));
  if(!S.cfg.aprovadorMaterial){ const lz = S.users.find(u => u.id.startsWith('luiz')) || S.users.find(u => (eq.find(r => r.email.toLowerCase() === u.id) || {}).papel === 'socio'); S.cfg.aprovadorMaterial = lz ? lz.id : me; }
  setUsers(S.users.filter(u => !u.inativo));
  rebuildProps(); DB.ready = true; ungate(); render(); save();
  sb.channel('pm-docs').on('postgres_changes', {event:'*', schema:'public', table:'pm_docs'}, onRemote).subscribe();
  startPresence();
}

function progress(p){
  let tot = 0, ok = 0;
  p.tarefas.forEach(t => { tot++; if(t.status === 'concluida') ok++; });
  return {tot, ok, pct: tot ? Math.round(ok * 100 / tot) : 0};
}
function lateCount(p){
  let n = 0;
  p.tarefas.forEach(t => { if(t.status !== 'concluida' && t.prazo && diffDays(t.prazo) < 0) n++;
    t.subs.forEach(s => { if(!s.feito && s.prazo && diffDays(s.prazo) < 0) n++; }); });
  return n;
}
function nextDue(p){
  const ds = [];
  p.tarefas.forEach(t => { if(t.status !== 'concluida' && t.prazo) ds.push(t.prazo); t.subs.forEach(s => { if(!s.feito && s.prazo) ds.push(s.prazo); }); });
  return ds.sort()[0] || '';
}
function people(p){
  const set = new Set([p.resp]);
  p.tarefas.forEach(t => { if(t.status !== 'concluida'){ t.resp.forEach(r => set.add(r)); t.subs.forEach(s => { if(!s.feito && s.resp) set.add(s.resp); }); } });
  return [...set].filter(Boolean);
}
function myItems(){
  const out = [];
  S.procs.forEach(p => p.tarefas.forEach(t => {
    if(t.resp.includes(me)) out.push({k:'tarefa', p, t, titulo:t.titulo, prazo:t.prazo, feito:t.status === 'concluida'});
    t.subs.forEach(s => { if(s.resp === me) out.push({k:'subtarefa', p, t, s, titulo:s.titulo, prazo:s.prazo, feito:s.feito}); });
    t.coms.forEach(c => { if(c.atrib === me) out.push({k:'comentário', p, t, c, titulo:c.texto, prazo:'', feito:!!c.resolvido}); });
  }));
  return out;
}

function alertOf(p){
  const nd = nextDue(p), a = tramAtual(p);
  return {prazo7:!!nd && diffDays(nd) <= 7 && isOpen(p), exig:p.status === 'notificado', parado:!!a && a.dias >= 7 && isOpen(p)};
}
function filteredProcs(){
  const q = norm(ui.q);
  return S.procs.filter(p => {
    const pr = propById(p.propId);
    if(ui.sel.g && pr.grupo !== ui.sel.g) return false;
    if(ui.sel.e && pr.emp !== ui.sel.e) return false;
    if(q && !norm([p.codigo, pr.cliente, pr.emp, p.servico, p.protocolo].join(' ')).includes(q)) return false;
    if(ui.fResp && !people(p).includes(ui.fResp)) return false;
    if(ui.fServ && p.modelo !== ui.fServ) return false;
    if(ui.fMine && !people(p).includes(me)) return false;
    if(ui.fAlert && !alertOf(p)[ui.fAlert]) return false;
    return true;
  });
}

const IMOVEL = [['endereco', 'Endereço'], ['bairro', 'Bairro'], ['cidade', 'Cidade'], ['matricula', 'Matrícula / cartório'], ['iptu', 'Inscrição imobiliária (IPTU)'], ['areaTerreno', 'Área do terreno'], ['areaConstruida', 'Área construída projetada'], ['zoneamento', 'Zoneamento']];
function cleanHtml(html){
  const ok = {B:1, STRONG:1, I:1, EM:1, U:1, S:1, STRIKE:1, UL:1, OL:1, LI:1, P:1, BR:1, DIV:1, A:1, H3:1, SPAN:1};
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const walk = n => { [...n.childNodes].forEach(c => {
    if(c.nodeType === 1){
      if(!ok[c.tagName]){ c.replaceWith(...c.childNodes); walk(n); return; }
      [...c.attributes].forEach(a => { if(!(c.tagName === 'A' && a.name === 'href')) c.removeAttribute(a.name); });
      if(c.tagName === 'A'){ if(!/^https?:\/\//i.test(c.getAttribute('href') || '')) c.removeAttribute('href'); else { c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener'); } }
      walk(c);
    } else if(c.nodeType !== 3) c.remove(); }); };
  const root = doc.body.firstChild; walk(root); return root.innerHTML;
}

const TRAM_AC = {recebeu:{l:'recebeu o processo', i:'entrada', c:'#0000FF'}, encaminhou:{l:'encaminhou o processo', i:'envio', c:'#000000'},
  exigencia:{l:'emitiu exigência / notificação', i:'alerta', c:'#D92D20'}, despacho:{l:'despachou', i:'nota', c:'#00A9CC'},

const tramSort = p => [...(p.tram || [])].sort((a, b) => b.em.localeCompare(a.em));
function tramAtual(p){
  const t = tramSort(p)[0]; if(!t) return null;

const fmtDT = v => { if(!v) return ''; const [d, h] = v.split('T'); const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y} às ${h}`; };
function parseTram(txt){
  const t = txt.replace(/\r/g, '').replace(/[ \t\u00a0]+/g, ' ').trim();
  const dt = String.raw`em\s+[^,]{3,15},\s*(\d{1,2})\s+de\s+([A-Za-zçÇ]+)\s+de\s+(\d{4})\s+às\s+(\d{1,2}):(\d{2})(?::\d{2})?(?:[ ]*\(duração:\s*([^)\n]{0,60}?)(?:\)|(?=\n)|$))?`;
  const re = new RegExp(String.raw`(.+?)\s+(recebeu o processo|encaminhou o processo para\s+(.+?))\s+(?:Recebido|Encaminhado)\s+por\s+(.+?)\s*\(([^)]*)\)\s*` + dt, 'gi');
  const out = []; let m, last = 0;
  while((m = re.exec(t))){
    const mes = MESES[norm(m[7])]; if(!mes) continue;
    const enc = /^encaminhou/i.test(m[2]);
    out.push({id:uid(), acao:enc ? 'encaminhou' : 'recebeu', de:m[1].trim(), para:enc ? m[3].trim() : '', por:m[4].trim(), email:m[5].trim(),
      em:`${m[8]}-${pad(mes)}-${pad(m[6])}T${pad(m[9])}:${m[10]}`, dur:(m[11] || '').trim(), obs:'', autor:me});
    last = re.lastIndex;
  }

}

function addTram(p, items){
  const key = t => t.acao + '|' + norm(t.de) + '|' + t.em;
  const have = new Set((p.tram = p.tram || []).map(key));
  const novos = items.filter(t => !have.has(key(t)));
  p.tram.push(...novos);
  if(novos.length){
    logP(p, `registrou ${novos.length} movimentaç${novos.length === 1 ? 'ão' : 'ões'} na tramitação`);
    const a = tramAtual(p);
    new Set([p.resp, ...people(p)]).forEach(u => notify(u, `atualizou a tramitação de ${esc(p.codigo)}: agora em ${esc(a.setor)}`, p.id, null));
  }
  return novos.length;
}

function barsHtml(items){
  let data;

    const now = new Date(); data = [];
    for(let k = -3; k <= 2; k++){ const d = new Date(now.getFullYear(), now.getMonth() + k, 1); const ym = isoOf(d).slice(0, 7);
      const its = items.filter(x => (x.prazo || '').startsWith(ym)); data.push({l:MESN[d.getMonth()].slice(0, 3), cur:k === 0, done:its.filter(x => x.feito).length, pend:its.filter(x => !x.feito).length}); }
  } else {
    const now = new Date(); const dow = (now.getDay() + 6) % 7; const mon = new Date(now); mon.setDate(now.getDate() - dow);
    data = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'].map((l, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); const iso = isoOf(d);
      const its = items.filter(x => x.prazo === iso); return {l, cur:iso === TODAY, done:its.filter(x => x.feito).length, pend:its.filter(x => !x.feito).length}; });
  }

  const steps = [0, .25, .5, .75, 1].map(f => Math.round(max * f));

}

function resizePhoto(file, cb){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
      const S2 = 160, c = document.createElement('canvas'); c.width = c.height = S2; const x = c.getContext('2d');
      const m = Math.min(img.width, img.height); x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S2, S2);
      cb(c.toDataURL('image/jpeg', .82)); }; img.src = r.result; };
  r.readAsDataURL(file);
}

const addDays = (iso, n) => { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return isoOf(d); };
function licInfo(l){
  const protocolarAte = addDays(l.validade, -(Number(l.antecedencia) || 0));

/* ---------- Rastreio de tempo ---------- */
const nowISO = () => new Date().toISOString();
const sessOf = t => (t.time = t.time || []);
const runningOf = t => sessOf(t).filter(x => !x.fim);
const msOf = x => (x.fim ? new Date(x.fim) : new Date()) - new Date(x.ini);
const timeTotal = t => sessOf(t).reduce((a, x) => a + msOf(x), 0);
const procTime = p => p.tarefas.reduce((a, t) => a + timeTotal(t), 0);
function fmtDur(ms){ const m = Math.round(ms / 60000); if(m < 60) return m + 'min'; const h = Math.floor(m / 60); return h + 'h' + (m % 60 ? ' ' + pad(m % 60) + 'min' : ''); }
function fmtClock(ms){ const s = Math.max(0, Math.floor(ms / 1000)); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
function startTimer(p, t, by){ by = by || me; if(runningOf(t).some(x => x.por === by)) return; sessOf(t).push({id:uid(), por:by, ini:nowISO(), fim:null}); logT(t, 'começou a rastrear o tempo'); }
function stopTimers(t, why){ const r = runningOf(t); if(!r.length) return; r.forEach(x => x.fim = nowISO()); logT(t, `${why || 'parou o rastreio de tempo'} (${fmtDur(r.reduce((a, x) => a + msOf(x), 0))})`); }
function myRunningOf(uid){ let n = 0; S.procs.forEach(p => p.tarefas.forEach(t => runningOf(t).forEach(x => { if(x.por === uid) n++; }))); (S.mats || []).forEach(m => runningOf(m).forEach(x => { if(x.por === uid) n++; })); return n; }
function myRunning(){ const out = []; S.procs.forEach(p => p.tarefas.forEach(t => runningOf(t).forEach(x => { if(x.por === me) out.push({p, t, x}); }))); (S.mats || []).forEach(m => runningOf(m).forEach(x => { if(x.por === me) out.push({p:null, t:m, x, mat:true}); })); return out; }
function weekMs(uid){ const now = new Date(); const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7)); mon.setHours(0, 0, 0, 0);
  let ms = 0; const f = t => sessOf(t).forEach(x => { if(x.por === uid && new Date(x.fim || Date.now()) >= mon) ms += msOf(x); }); S.procs.forEach(p => p.tarefas.forEach(f)); (S.mats || []).forEach(f); return ms; }
// marcador ao vivo: <span data-live="ms-acumulado|inícios separados por vírgula">
function liveAttr(t, onlyMe){ const ss = sessOf(t).filter(x => !onlyMe || x.por === me); const closed = ss.filter(x => x.fim).reduce((a, x) => a + msOf(x), 0);
  return `data-live="${closed}|${ss.filter(x => !x.fim).map(x => x.ini).join(',')}"`; }
function tickLive(){ $$('[data-live]').forEach(el => { const [c, ins] = el.dataset.live.split('|'); let ms = Number(c) || 0; (ins ? ins.split(',') : []).forEach(i => ms += Date.now() - new Date(i)); el.textContent = fmtClock(ms); }); }
setInterval(tickLive, 1000);
function timerBadge(t){

  const itRow = r => { const q = qtdNum(r.qtd), showT = mult && r.unit !== undefined && r.unit !== '' && q !== 1;
    return `<tr data-pit="${r.id}"><td><input class="inp" data-pi="qtd" value="${esc(r.qtd || '')}"></td>
      <td><input class="inp" data-pi="descricao" list="dlSrv" autocomplete="off" value="${esc(r.descricao || '')}" placeholder="Ex.: UNIFICAÇÃO IPTU's (ou escolha um serviço cadastrado)">${showT ? `<div class="sub" style="margin-top:3px">total (× ${String(q).replace('.', ',')}): <b>${brl(numBR(r.valor))}</b></div>` : ''}</td>
      <td><input class="inp num" data-pi="valor" inputmode="decimal" autocomplete="off" value="${esc(moneyIn(mult && r.unit !== undefined ? r.unit : r.valor))}" placeholder="0,00"></td>
      <td><button class="x" data-pidel="${r.id}" title="Remover item">✕</button></td></tr>`; };
  const semG = d.itens.filter(r => grpOf(d, r) < 0);
  const rows = semG.map(itRow).join('') + d.grupos.map((g, gi) => { const its = d.itens.filter(r => grpOf(d, r) === gi);
    return `<tr class="grp"><td class="gn">02.${gi + 1}</td><td><div class="gwrap"><input class="inp gt" data-pgt="${gi}" value="${esc(g.titulo || '')}" placeholder="Título da seção (ex.: REGULARIZAÇÃO FUNDIÁRIA)"><button class="btn sm" data-additg="${gi}">${ic('mais', 'sm')} item</button></div></td><td></td><td><button class="x" data-delgrp="${gi}" title="Remover seção">✕</button></td></tr>`
      + its.map(itRow).join('') + `<tr class="gsub"><td></td><td class="tot">SUBTOTAL 02.${gi + 1}</td><td class="tot">${brl(its.reduce((a, r) => a + numBR(r.valor), 0))}</td><td></td></tr>`; }).join('');
  const somaPct = d.parcelas.reduce((a, x) => a + numBR(x.pct), 0), pv = parcelValues(tot, d.parcelas);

  let k = 3; const secNum = d.secoes.map((s, i) => { if(i === apos) k++; return String(k++).padStart(2, '0'); });
  const assin = S.assin || {};
  return `${ok ? '<div class="banner" style="background:#E3F8EC;color:#065F46">Proposta aprovada. Se mudar o conteúdo, ela volta para aprovação.</div>' : ''}

    <button class="btn sm" data-secpadrao title="Usa a forma de pagamento e as cláusulas desta proposta como padrão das próximas">Salvar cláusulas como padrão</button><button class="btn sm ghost" data-secreset>Restaurar padrão</button></div>

function printProp(p){

  let fr = $('#printFrame'); if(!fr){ fr = document.createElement('iframe'); fr.id = 'printFrame'; fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(fr); }

  setTimeout(() => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch(e){ toast('Não consegui abrir a impressão'); } setTimeout(() => window.focus(), 300); }, 400);

function mesclar(t, p){

    empreendimento:p.emp, valor:docTotal(p.doc) ? brl(docTotal(p.doc)) : '', autor:U[me] ? U[me].nome : '', tipo:p.tipo};
  return String(t || '').replace(/\{(\w+)\}/g, (m, k) => k in v ? (v[k] || '') : m);
}

const lerB64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(file); });
async function enviarEmail(p){
  const para = $('#mlPara').value.trim();
  if(!para.split(',').every(x => /^\S+@\S+\.\S+$/.test(x.trim()))){ toast('Confira o e-mail do cliente'); return; }
  const f = $('#mlPdf').files[0]; let anexoB64 = '';
  if(f){ if(f.size > 8e6){ toast('O PDF passa de 8 MB'); return; } anexoB64 = await lerB64(f); }
  const em = {id:uid(), status:'pendente', para, cc:$('#mlCc').value.trim(), assunto:$('#mlAss').value.trim(), corpo:$('#mlMsg').value, replyTo:me, por:me, em:nowISO(),
    anexoNome:propFileName(p) + '.pdf', propId:p.id, assinatura:assinEmail()};
  if(anexoB64) em.anexoB64 = anexoB64; else em.html = propHtml(p, false, 'email');
  S.emails.push(em); (p.envios = p.envios || []).push({id:uid(), emailId:em.id, para, em:em.em, por:me});
  if(['liberada', 'revisao'].includes(p.status)) p.status = 'enviada'; propLog(p, `enviou a proposta por e-mail para ${para}`);
  if(!p.email) p.email = para.split(',')[0].trim();
  save(); closeTask(); render(); toast('Na fila de envio. A ponte envia em até 1 minuto.');
}

async function buscarImport(){
  const api = $('#impApi').value.trim(), token = $('#impTok').value;
  if(!api || !token){ toast('Preencha o endereço e a senha'); return; }
  localStorage.setItem('pm_api_prop', J({api, token})); $('#impMsg').textContent = 'Buscando…';
  try {
    const r = await fetch(api, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:J({action:'list', token})});
    const j = JSON.parse(await r.text()); if(!j.ok) throw new Error(j.error || 'erro');
    const ja = new Set(S.propsDb.map(p => p.origemId).filter(Boolean));
    const abertas = (j.items || []).filter(it => PROP_ABERTAS.includes(it.status) && !ja.has(it.id));
    ui.impList = abertas; $('#impMsg').textContent = '';
    $('#layer').innerHTML = `<div class="mlayer" data-mclose><div class="modal small" style="width:min(760px,100%)">
      <div class="mhead"><b style="color:var(--ink);font-size:17px;font-family:var(--kanit);font-weight:500">Importar propostas em aberto</b><span class="spacer"></span><button class="btn ghost" data-tclose>✕</button></div>
      <div style="padding:14px 20px;overflow:auto;max-height:60vh">${abertas.length ? `<p class="sub" style="margin-top:0">Marquei as que têm competência <b>MANNARE</b>. Confira e desmarque o que não for da Mannare.</p>` + abertas.map((it, i) => { const comp = ((it.fin || {}).competencia || '').toUpperCase(); return `<label class="gopt" style="border-bottom:1px solid var(--line)"><input type="checkbox" data-imp="${i}" ${comp === 'MANNARE' ? 'checked' : ''}><span style="flex:1"><b>${esc(it.codigo || '')}</b> | ${esc(it.empreendimento || it.cliente || '')} <span class="sub">| ${esc(it.cliente || '')} | ${esc((PROP_ST[it.status] || {}).l || it.status)} | competência: ${esc(comp || '—')}</span></span></label>`; }).join('') : '<p>Nenhuma proposta em aberto para importar (ou todas já foram importadas).</p>'}</div>

  } catch(e){ $('#impMsg').textContent = ''; toast('Não deu certo: ' + e.message); }
}

const EMAIL_CATS = [
  {k:'tarefas', l:'Tarefas', sub:'Tarefa ou subtarefa atribuída a você, concluída, pedidos de aprovação e respostas.', def:false},
  {k:'mencoes', l:'Comentários', sub:'Menções (@), comentários atribuídos a você, respostas aos seus comentários e comentários seus resolvidos.', def:true},
  {k:'processos', l:'Processos', sub:'Processo aberto ou passado para você.', def:false},
  {k:'tramitacao', l:'Tramitação', sub:'Quando a tramitação de um processo seu é atualizada.', def:false},
  {k:'licencas', l:'Vencimento de licenças', sub:'Resumo das 7h quando uma licença entra no prazo de renovação, e licenças atribuídas a você.', def:true},
  {k:'propostasNovas', l:'Propostas novas', sub:'Quando alguém cadastra uma proposta nova.', def:false},
  {k:'propostas', l:'Aprovação de propostas', sub:'Pedidos de aprovação, propostas aprovadas e ajustes pedidos.', def:false},
  {k:'material', l:'Material técnico', sub:'Validação interna pedida a você e material entregue.', def:false},
  {k:'financeiro', l:'Financeiro', sub:'Resumo das 7h com contas a pagar vencendo e recebíveis atrasados.', def:false}];
function querEmail(id, k){ const u = U[id], c = EMAIL_CATS.find(x => x.k === k), v = u && u.emailPrefs ? u.emailPrefs[k] : undefined; return v === undefined ? !!(c && c.def) : !!v; }
function catDe(txt, ctx){
  if(/^(mencionou você|atribuiu um comentário a você|resolveu seu comentário|respondeu)/.test(txt)) return 'mencoes';
  if(/tramitação/.test(txt)) return 'tramitacao';
  if(/licença|renovação/i.test(txt)) return 'licencas';
  if(ctx.propId) return 'propostas';
  if(ctx.matId) return 'material';
  if(ctx.taskId || /tarefa/.test(txt)) return 'tarefas';
  return 'processos';
}
const limpaHtml = t => String(t || '').replace(/<[^>]+>/g, '').replace(/&quot;|&#39;|&amp;|&lt;|&gt;/g, s => ({'&quot;':'"', '&#39;':"'", '&amp;':'&', '&lt;':'<', '&gt;':'>'})[s]);
function filaEmail(para, cat, assunto, corpo){
  if(!para || !/@/.test(para) || S.cfg.mencaoEmailOff || !querEmail(para, cat)) return;
  S.emails.push({id:uid(), status:'pendente', tipo:'aviso', cat, para, cc:'', replyTo:me, por:me, em:nowISO(), assunto:assunto.slice(0, 150),
    corpo:`Olá, ${first(para)}.\n\n${corpo}\n\nAbrir no CRM: ${location.origin + location.pathname}\n\n(Aviso automático do CRM Mannare. Para escolher o que você recebe por e-mail: Integrações › Avisos por e-mail.)`});
}
function emailAviso(para, txt, ctx, comentario){
  if(!para || para === me) return;
  const cat = catDe(txt, ctx), t = limpaHtml(txt), quem = U[me] ? U[me].nome : me;
  filaEmail(para, cat, `${first(me)} ${t}`, `${quem} ${t}${comentario ? ':\n\n"' + comentario + '"' : '.'}`);
}
function ultimoComDe(arr){ const c = (arr || []).slice(-1)[0]; return c && c.autor === me && Date.now() - new Date(c.em).getTime() < 60000 ? c.texto : ''; }
const ehCom = txt => /^(mencionou você|atribuiu um comentário a você)/.test(txt);
function notify(para, txt, procId, taskId){
  if(!para || para === me) return;
  S.notifs.unshift({id:uid(), para, txt:`<b>${esc(first(me))}</b> ${txt}`, procId, taskId, em:new Date().toISOString(), lida:false});
  if(procId){ const p = procById(procId), t = p && taskId ? taskOf(p, taskId) : null; emailAviso(para, txt, {procId, taskId}, ehCom(txt) ? ultimoComDe(t ? t.coms : p && p.coms) : ''); }

function notifyMat(para, txt, m){ if(!para || para === me) return; S.notifs.unshift({id:uid(), para, txt:`<b>${esc(first(me))}</b> ${txt}`, procId:null, taskId:null, matId:m.id, em:nowISO(), lida:false});

const combo = {inp:null, items:[], sel:-1, el:null};
function comboItens(inp){ const id = inp.dataset.comboList || inp.getAttribute('list'); const dl = id && document.getElementById(id); if(!dl) return null;
  return [...dl.options].map(o => ({v:o.value, l:o.label && o.label !== o.value ? o.label : ''})); }
function comboAbrir(inp){
  const its = comboItens(inp); if(!its) return;
  if(inp.getAttribute('list')){ inp.dataset.comboList = inp.getAttribute('list'); inp.removeAttribute('list'); inp.setAttribute('autocomplete', 'off'); }
  combo.inp = inp; combo.all = its; comboFiltrar();
}
function comboFiltrar(){
  const inp = combo.inp; if(!inp) return; const q = normN(inp.value), its = combo.all.filter(i => !q || normN(i.v + ' ' + i.l).includes(q));
  const exato = its.length === 1 && normN(its[0].v) === q; combo.items = exato ? [] : its.slice(0, 60); combo.sel = -1;
  let el = combo.el; if(!el){ el = combo.el = document.createElement('div'); el.className = 'combo'; document.body.appendChild(el);
    el.addEventListener('mousedown', ev => { ev.preventDefault(); const it = ev.target.closest('[data-ci]'); if(it) comboEscolher(+it.dataset.ci); }); }
  if(!combo.items.length){ el.style.display = 'none'; return; }
  const b = inp.getBoundingClientRect(), baixo = window.innerHeight - b.bottom, h = Math.min(300, combo.items.length * 52 + 8);
  el.style.cssText = `display:block;left:${b.left}px;width:${Math.max(b.width, 280)}px;max-height:${Math.max(160, Math.min(300, baixo > 200 ? baixo - 16 : b.top - 16))}px;` + (baixo > Math.min(h, 200) + 16 || baixo > b.top ? `top:${b.bottom + 4}px` : `bottom:${window.innerHeight - b.top + 4}px`);
  const marca = s => { const t = esc(s); if(!q) return t; const n = normN(s), i = n.indexOf(q); return i < 0 ? t : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
  el.innerHTML = combo.items.map((it, i) => `<div class="ci" data-ci="${i}"><div class="cv">${marca(it.v)}</div>${it.l ? `<div class="cl">${esc(it.l)}</div>` : ''}</div>`).join('') + (its.length > 60 ? `<div class="cmore">+ ${its.length - 60}… continue digitando</div>` : '');
}
function comboFechar(){ if(combo.el) combo.el.style.display = 'none'; combo.inp = null; combo.items = []; }
function comboMarcar(){ $$('.combo .ci').forEach((x, i) => x.classList.toggle('on', i === combo.sel)); const on = $('.combo .ci.on'); if(on) on.scrollIntoView({block:'nearest'}); }
function comboEscolher(i){ const inp = combo.inp, it = combo.items[i]; if(!inp || !it) return; inp.value = it.v; comboFechar(); inp.dispatchEvent(new Event('input', {bubbles:true})); inp.dispatchEvent(new Event('change', {bubbles:true})); }
document.addEventListener('focusin', e => { const t = e.target; if(t && t.tagName === 'INPUT' && (t.getAttribute('list') || t.dataset.comboList)) comboAbrir(t); else if(combo.inp && t !== combo.inp) comboFechar(); });
document.addEventListener('input', e => { if(e.target === combo.inp) comboFiltrar(); }, true);
document.addEventListener('focusout', e => { if(e.target === combo.inp) setTimeout(() => { if(document.activeElement !== combo.inp) comboFechar(); }, 120); });
document.addEventListener('keydown', e => {
  if(!combo.inp || e.target !== combo.inp || !combo.items.length || !combo.el || combo.el.style.display === 'none') return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); combo.sel = Math.min(combo.items.length - 1, combo.sel + 1); comboMarcar(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); combo.sel = Math.max(0, combo.sel - 1); comboMarcar(); }
  else if(e.key === 'Enter' && combo.sel >= 0){ e.preventDefault(); e.stopPropagation(); comboEscolher(combo.sel); }
  else if(e.key === 'Escape'){ e.stopPropagation(); comboFechar(); }
}, true);
document.addEventListener('scroll', e => { if(combo.inp && combo.el && !combo.el.contains(e.target)) comboFechar(); }, true);

function planItens(uid){
  const out = [];
  S.procs.forEach(p => { const pr = propById(p.propId) || {}, onde = `${p.codigo} | ${pr.emp || ''}`;
    (p.tarefas || []).forEach(t => {
      if(t.resp.includes(uid)) out.push({ref:`t|${p.id}|${t.id}`, k:'tarefa', titulo:t.titulo, onde, prazo:t.prazo, feito:t.status === 'concluida', aberto:isOpen(p)});
      (t.subs || []).forEach(s => { if(s.resp === uid) out.push({ref:`s|${p.id}|${t.id}|${s.id}`, k:'subtarefa', titulo:s.titulo, onde:`${t.titulo} | ${p.codigo}`, prazo:s.prazo, feito:!!s.feito, aberto:isOpen(p)}); });
    }); });
  (S.mats || []).forEach(m => { if((m.resp || []).includes(uid)) out.push({ref:`m|${m.id}`, k:'material', titulo:m.titulo || m.codigo, onde:m.codigo, prazo:m.prazo, feito:m.status === 'entregue', aberto:true}); });
  return out.concat(revisoesDe(uid));
}
function itemDe(ref){
  const [k, a, b, c] = String(ref || '').split('|');
  if(k === 'r' || k === 'v'){ const it = revisoesDe(planUser()).concat(revisoesDe(me)).find(x => x.ref === ref); if(it) return it;
    if(k === 'v'){ const m = matById(a); return m ? {ref, k:'validação', titulo:`Validar: ${m.titulo || m.codigo}`, onde:m.codigo, prazo:'', feito:m.status !== 'validacao'} : null; }
    const p = procById(a), t = p && taskOf(p, b); return t ? {ref, k:'revisão', titulo:`Revisar: ${t.titulo}`, onde:p.codigo, prazo:(t.aprov || {}).ate || '', feito:!(t.aprov && t.aprov.st === 'pendente')} : null; }
  if(k === 'm'){ const m = matById(a); return m ? {ref, k:'material', titulo:m.titulo || m.codigo, onde:m.codigo, prazo:m.prazo, feito:m.status === 'entregue'} : null; }

let savedRange = null;
function insertLink(){
  let u = $('#edLink').value.trim(); if(!u) return;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  const ed = $('#drawer .edarea'); ed.focus();
  const sel = getSelection(); sel.removeAllRanges();
  if(savedRange && ed.contains(savedRange.commonAncestorContainer)) sel.addRange(savedRange);
  if(sel.isCollapsed || !sel.rangeCount){ document.execCommand('insertHTML', false, `<a href="${esc(u)}">${esc(u)}</a>&nbsp;`); }
  else document.execCommand('createLink', false, u);
  $('#drawer .linkrow').hidden = true;
}

  if(tg.id === 'gq'){ ui.q = tg.value; ui.sel = {g:'', e:''}; if(ui.view !== 'proc'){ ui.view = 'proc'; } render(); const n = $('#gq'); n.focus(); return; }
  if(tg.id === 'tq'){ ui.tq = tg.value; const pos = tg.selectionStart; render(); const n = $('#tq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if(tg.id === 'pq'){ ui.q = tg.value; const pos = tg.selectionStart; render(); const n = $('#pq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if(tg.matches('.composer textarea')) mentionMenu(tg);
});
document.addEventListener('keydown', e => {
  const tg = e.target;
  if(e.key === '/' && !tg.closest('input,textarea,select,[contenteditable]')){ e.preventDefault(); $('#gq').focus(); return; }
  if(matHandleKey(e, tg)) return;
  if(e.key === 'Escape'){ if(!$('#pop').hidden){ $('#pop').hidden = true; return; } if($('#layer').innerHTML){ memberDraft = null; closeTask(); return; } if(ui.drawer){ closeDrawer(); return; } }
  if(tg.id === 'newTask' && e.key === 'Enter'){ addTask(); return; }
  if(tg.id === 'edLink' && e.key === 'Enter'){ e.preventDefault(); insertLink(); return; }
  if(tg.id === 'driveUrl' && e.key === 'Enter'){ $('[data-drivesave]').click(); return; }
  if(tg.id === 'newSub' && e.key === 'Enter'){ const v = tg.value.trim(); if(!v) return; const [p, t] = curTask();
    t.subs.push({id:uid(), titulo:v, feito:false, resp:'', prazo:''}); logT(t, `criou a subtarefa “${v}”`); save(); renderTask(); render(); setTimeout(() => $('#newSub')?.focus(), 0); return; }
  if(tg.matches('.composer textarea')){
    const menu = $('.mentions', tg.closest('.composer'));
    if(!menu.hidden && (e.key === 'Enter' || e.key === 'Tab')){ e.preventDefault(); const it = $('div.on', menu) || $('div', menu); if(it) pickMention(it); return; }
    if(!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){ e.preventDefault(); const its = $$('div', menu); let i = its.findIndex(x => x.classList.contains('on')); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + its.length) % its.length; its.forEach((x, j) => x.classList.toggle('on', j === i)); return; }
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sendComment(tg.closest('.composer')); }
  }
  if(tg.matches('input.st, .ttitle') && e.key === 'Enter') tg.blur();
});
function mentionMenu(ta){
  const menu = $('.mentions', ta.closest('.composer'));
  const m = ta.value.slice(0, ta.selectionStart).match(/@([A-Za-zÀ-ú]*)$/);
  if(!m){ menu.hidden = true; return; }
  const q = norm(m[1]);
  const us = USERS.filter(u => norm(u.nome).startsWith(q) || norm(first(u.id)).startsWith(q));
  if(!us.length){ menu.hidden = true; return; }
  menu.innerHTML = us.map((u, i) => `<div data-u="${u.id}" class="${i === 0 ? 'on' : ''}">${av(u.id, true, true)}${esc(u.nome)}</div>`).join('');
  menu.hidden = false;
}
function pickMention(el){
  const box = el.closest('.composer'), ta = $('textarea', box), pos = ta.selectionStart;
  const before = ta.value.slice(0, pos).replace(/@([A-Za-zÀ-ú]*)$/, '@' + first(el.dataset.u) + ' ');
  ta.value = before + ta.value.slice(pos); ta.focus(); ta.setSelectionRange(before.length, before.length);
  $('.mentions', box).hidden = true;
}
// arrastar no quadro
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.kcard,.pk'); if(c){ e.dataTransfer.setData('text/plain', c.dataset.proc); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const col = e.target.closest?.('.col,.pcol'); if(col){ e.preventDefault(); $$('.col,.pcol').forEach(x => x.classList.toggle('over', x === col)); } });
document.addEventListener('dragleave', e => { if(!e.relatedTarget?.closest?.('.col,.pcol,.mcol')) $$('.col,.pcol,.mcol').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.mcard:not(.pk)'); if(c){ e.dataTransfer.setData('text/plain', 'mat:' + c.dataset.mat); } });
document.addEventListener('dragover', e => { const col = e.target.closest?.('.mcol'); if(col){ e.preventDefault(); $$('.mcol').forEach(x => x.classList.toggle('over', x === col)); } });
document.addEventListener('drop', e => { const col = e.target.closest?.('.mcol'); if(!col) return; e.preventDefault(); $$('.mcol').forEach(x => x.classList.remove('over'));
  const d = e.dataTransfer.getData('text/plain'); if(!d.startsWith('mat:')) return; const m = matById(d.slice(4)); if(m && m.status !== col.dataset.mcol){ setMatStatus(m, col.dataset.mcol); save(); render(); toast(`${m.codigo} → ${MS[m.status].l}`); } });
document.addEventListener('drop', e => { const col = e.target.closest?.('.col,.pcol'); if(!col) return; e.preventDefault();
  const p = procById(e.dataTransfer.getData('text/plain')); $$('.col,.pcol').forEach(x => x.classList.remove('over'));
  if(p && p.status !== col.dataset.col){ const old = p.status; logP(p, `mudou o status do processo para “${PS[col.dataset.col].l}”`); p.status = col.dataset.col; save(); render(); toast(`${p.codigo} → ${PS[p.status].l}`); afterStatus(p, old); } });

boot();
</script>
